  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      const words = gsap.utils.toArray(
        "#fc05-proof-copy [class~=\"05-cryptography-causality-word\"]"
      );
      const wordSchedule = words.reduce((schedule, word, index) => {
        const previousEnd = index === 0 ? 0.18 : schedule[index - 1].end;
        const duration = 0.26 + word.textContent.length * 0.045;
        schedule.push({ word, start: previousEnd, end: previousEnd + duration });
        return schedule;
      }, []);

      wordSchedule.forEach(({ word, start }) => {
        tl.fromTo(
          word,
          { x: -34, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.52, ease: "power3.out" },
          start
        );
      });

      tl.fromTo(
        "#fc05-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
        2.12
      );
      tl.fromTo(
        "#fc05-note",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        2.4
      );

      tl.set(
        [
          "#fc05-proof-copy",
          "#fc05-rule",
          "#fc05-note"
        ],
        { autoAlpha: 0 },
        3.1
      );

      tl.fromTo(
        "#fc05-f01-tag",
        { x: -26, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
        3.18
      );
      tl.fromTo(
        "#fc05-f01-stack",
        { scaleX: 1.035, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.36, ease: "power4.out" },
        3.22
      );

      const glitchCopies = gsap.utils.toArray(
        "#fc05-f01-stack " +
        "[class~=\"05-cryptography-causality-f01-outline-warm\"], " +
        "#fc05-f01-stack " +
        "[class~=\"05-cryptography-causality-f01-outline-cool\"]"
      );
      const glitchAmplitude = { value: 0 };
      const glitchHash = n => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      tl.set(glitchAmplitude, { value: 1 }, 3.22);
      tl.set(glitchCopies, { opacity: 0.68 }, 3.22);
      tl.to(
        glitchAmplitude,
        {
          value: 0,
          duration: 0.38,
          ease: "power3.in",
          onUpdate: () => {
            const step = Math.floor(tl.time() / (1 / 20));
            glitchCopies.forEach((copy, index) => {
              const x =
                (glitchHash(step * 13 + index * 7) * 2 - 1) *
                11 *
                glitchAmplitude.value;
              const y =
                (glitchHash(step * 29 + index * 11) * 2 - 1) *
                4 *
                glitchAmplitude.value;
              gsap.set(copy, { x, y });
            });
          }
        },
        3.22
      );
      tl.set(glitchCopies, { x: 0, y: 0, opacity: 0 }, 3.6);

      tl.fromTo(
        "#fc05-hash-card",
        { x: -210, rotateY: 18, opacity: 0 },
        { x: 0, rotateY: 0, opacity: 1, duration: 0.88, ease: "power3.out" },
        6.6
      );
      tl.fromTo(
        "#fc05-cause-card",
        { x: 210, rotateY: -18, opacity: 0 },
        { x: 0, rotateY: 0, opacity: 1, duration: 0.88, ease: "power3.out" },
        6.78
      );
      tl.fromTo(
        "#fc05-split-stage [class~=\"05-cryptography-causality-card-label\"]",
        { y: 12, opacity: 0 },
        {
          y: 0,
          opacity: 1,
          duration: 0.46,
          stagger: 0.12,
          ease: "power2.out"
        },
        7.08
      );
      tl.fromTo(
        "#fc05-split-stage [class~=\"05-cryptography-causality-card-verdict\"]",
        { y: 16, opacity: 0 },
        {
          y: 0,
          opacity: 1,
          duration: 0.52,
          stagger: 0.14,
          ease: "power2.out"
        },
        7.28
      );
      tl.to(
        "#fc05-hash-card",
        { y: -5, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 1 },
        8.0
      );
      tl.to(
        "#fc05-cause-card",
        { y: 5, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 1 },
        8.0
      );

      window.__timelines["05-cryptography-causality"] = tl;
    })();
  </script>
