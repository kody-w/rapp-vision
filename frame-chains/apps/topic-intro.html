<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Chains: the essentials</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main { max-width: 1120px; margin: auto; padding: 20px 24px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; }
    .eyebrow, #part { color: var(--cp-text-muted); margin: 0; font-size: 14px; }
    #part { white-space: nowrap; font-family: Consolas, "Courier New", Courier, monospace; }
    h1 { margin: 8px 0 16px; font-size: clamp(24px, 3.4vw, 36px); line-height: 1.15; }
    #points {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0;
      margin: 0 0 16px;
      list-style: none;
    }
    #points li {
      border: 1px solid var(--cp-border);
      border-left: 4px solid var(--cp-accent);
      border-radius: 16px;
      background: var(--cp-surface);
      padding: 14px 16px;
      font-size: 18px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    button {
      border: 1px solid var(--cp-border-strong);
      border-radius: .625rem;
      padding: 10px 16px;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      min-height: 44px;
    }
    #hear { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
    #hear:hover { background: var(--cp-accent-hover); }
    button:disabled { color: var(--cp-text-muted); background: var(--cp-surface-soft); cursor: not-allowed; }
    button:focus-visible, summary:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 3px; }
    #status { min-height: 24px; margin: 10px 0 0; color: var(--cp-text-muted); font-size: 15px; }
    #status[data-error="true"] { color: var(--cp-danger); }
    details { margin-top: 12px; border-top: 1px solid var(--cp-border); padding-top: 10px; }
    summary { cursor: pointer; color: var(--cp-link); }
    a { color: var(--cp-link); }
    #transcript-text { line-height: 1.55; max-width: 90ch; margin-bottom: 0; }
    @media (max-width: 560px) {
      main { padding: 16px; }
      header { align-items: center; gap: 12px; }
      #points { grid-template-columns: 1fr; gap: 8px; }
      #points li { font-size: 17px; padding: 12px; }
      button { padding: 10px 12px; }
    }
  </style>
  <script type="module" src="topic-intro.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Frame Chains / Start here</p>
      <p id="part" aria-label="Chapter progress"></p>
    </header>
    <h1 id="heading">Loading the introduction</h1>
    <ul id="points"></ul>
    <div class="controls" aria-label="Introduction controls">
      <button id="hear" type="button" disabled>Hear the explanation</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="previous" type="button" disabled>Previous</button>
      <button id="next" type="button" disabled>Next</button>
      <button id="reset" type="button" disabled>Reset</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading the lesson's text and narration.</p>
    <details id="transcript">
      <summary>Read the full explanation</summary>
      <p id="transcript-text"></p>
    </details>
    <p class="eyebrow"><a href="https://github.com/kody-w/frame-chains" target="_blank" rel="noopener noreferrer">Source project and documentation</a></p>
    <audio id="narration" preload="metadata"></audio>
  </main>
</body>
</html>
