<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Why the Grid Overflows</title>
  <desc id="desc">A 480 pixel intrinsic rail sets a grid item automatic minimum; changing only min-width to zero restores equality.</desc>
  <rect width="960" height="540" fill="#f5f7f4"/>
  <path d="M0 48H960M0 96H960M0 144H960M0 192H960M0 240H960M0 288H960M0 336H960M0 384H960M0 432H960M0 480H960" stroke="#d3dcdd"/>
  <rect width="960" height="88" fill="#0c1522"/>
  <text x="42" y="35" fill="#f5b842" font-family="monospace" font-size="18" font-weight="700">CSS GRID / MEASURE, FIX, VERIFY</text>
  <text x="42" y="70" fill="#f5f7f4" font-family="sans-serif" font-size="33" font-weight="900">WHY THE GRID OVERFLOWS</text>
  <rect x="72" y="139" width="430" height="212" fill="#eef2f2" stroke="#0c1522" stroke-width="4"/>
  <rect x="502" y="139" width="240" height="212" fill="#ffe2e1" stroke="#d33a3d" stroke-width="4"/>
  <rect x="94" y="178" width="118" height="118" fill="#2d68c4"/>
  <rect x="224" y="178" width="480" height="118" fill="#fcd267"/>
  <text x="115" y="246" fill="#fff" font-family="monospace" font-size="22" font-weight="800">META</text>
  <text x="250" y="224" fill="#0c1522" font-family="monospace" font-size="21" font-weight="800">480PX INTRINSIC RAIL</text>
  <text x="250" y="264" fill="#7e1e24" font-family="monospace" font-size="19" font-weight="800">ITEM MIN-WIDTH: AUTO</text>
  <rect x="72" y="389" width="816" height="92" fill="#fff" stroke="#0c1522" stroke-width="4"/>
  <text x="104" y="430" fill="#d33a3d" font-family="monospace" font-size="28" font-weight="900">612 &gt; 320</text>
  <text x="330" y="430" fill="#0c1522" font-family="monospace" font-size="22">→ MIN-WIDTH: 0 ONLY →</text>
  <text x="704" y="430" fill="#1b845b" font-family="monospace" font-size="28" font-weight="900">320 = 320</text>
  <text x="104" y="463" fill="#5b6b77" font-family="sans-serif" font-size="18">Exact scrollWidth and clientWidth stay visible.</text>
</svg>
