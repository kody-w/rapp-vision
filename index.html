/* ---- network loader --------------------------------------------
   channels.json lists channel.json URLs. Each channel's media paths
   resolve against its own URL, so a channel can live in any repo.    */

function absolutise(url, base) {
  if (!url) return "";                 // absolutise(undefined) used to yield ".../undefined" and a real 404
  try { return new URL(url, base).href; } catch { return url; }
}

async function fetchChannel(entry) {
  const url = absolutise(entry.url, location.href);
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(entry.id + " HTTP " + r.status);
  const c = await r.json();
  const sourceIdentity = entry.legacy === LEGACY_POLICY.id && LEGACY_POLICY.registry_base
    ? absolutise(entry.url, LEGACY_POLICY.registry_base)
    : url;
  const contractErrors = validateChannelContract(c, sourceIdentity);
  if (contractErrors.length)
    throw new Error(`${entry.id || c.id || "channel"} rejected: ${contractErrors[0]}`);
  c._url = url;
  c._sourceIdentity = sourceIdentity;
  c._repo = entry.repo || c.repo || "";
  /* Be forgiving about shape. Anyone can publish a channel, so one typo in
     someone else's JSON must not blank the network: `poster` is the obvious
     name for a thumbnail and people reach for it, and `links` is just as
     naturally written as an object as an array. Accept both, render one. */
  if (c.links && !Array.isArray(c.links)) {
    c.links = Object.keys(c.links).map(k => ({ label: k, url: c.links[k] }));
  }
  (c.videos || []).forEach(v => {
    v._ch = c;
    v.thumb = absolutise(v.thumb || v.poster, url);
    (v.sources || []).forEach(s => { s.src = absolutise(s.src, url); });
    if (v.live) (v.live.scenes || []).forEach(sc => {
      if (sc.app) sc.app = absolutise(sc.app, url);
    });
  });
  return c;
}

async function loadLegacyPolicy() {
  try {
    const r = await fetch("policy/legacy-publications.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const policy = await r.json();
    if (policy.schema !== "rapp-vision-legacy-publications/1.0" ||
        !rvString(policy.id) || !rvString(policy.registry_base) || !Array.isArray(policy.channels))
      throw new Error("malformed policy");
    LEGACY_POLICY = policy;
  } catch (e) {
    LEGACY_POLICY = { channels: [] };
    console.warn("Legacy publication policy unavailable:", e);
  }
}

/* ---- Follow a GitHub account (the rappvision-* owner convention) ---------
   The convention: a public repo named rappvision-* with a channel.json at its
   root IS a channel. Following an owner turns the convention into a standing
   subscription — every matching repo they have now, and every one they create
   later, joins this player on the next load. No PR, no URL pasting, no
   registry edit.

   Static Data Covenant (RAR CONSTITUTION.md Article XXIV): the browser never
   calls api.github.com — this used to fetch the owner's repo listing live;
   now scripts/harvest_follows.py (CI, on a schedule) does that and commits
   the matching entries to state/follow-index.json in the exact
   {owner: {at, entries}} shape state.followCache already uses locally, so
   only the *source* of a first lookup changed, not the shape or the TTL
   logic below it.

   LIMITATION this trades in: an owner not yet in state/follow-seed.json
   won't resolve until they're added there and the harvester runs again —
   see that file's note. Before this migration, any typed-in owner resolved
   on the next reload via a live anonymous call. */
const FOLLOW_TTL_MS = 60 * 60 * 1000;

function conventionEntries(owner, repos) {
  return (repos || [])
    .filter(r => r && /^rappvision-/i.test(r.name || "") && !r.fork && !r.archived && !r.private)
    .map(r => ({
      id: ("gh:" + owner + "/" + r.name).toLowerCase(),
      url: `https://${owner}.github.io/${r.name}/channel.json`,
      alt: `https://raw.githubusercontent.com/${owner}/${r.name}/${r.default_branch || "main"}/channel.json`,
      repo: `https://github.com/${owner}/${r.name}`
    }));
}

async function ownerEntries(owner) {
  const cached = state.followCache[owner];
  if (cached && Date.now() - cached.at < FOLLOW_TTL_MS) return cached.entries;
  try {
    const r = await fetch(absolutise("state/follow-index.json", location.href), { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const snapshot = await r.json();
    const harvested = (snapshot.owners || {})[owner];
    if (!harvested) throw new Error("owner not yet harvested");
    state.followCache[owner] = { at: Date.now(), entries: harvested.entries }; save();
    return harvested.entries;
  } catch {
    return cached ? cached.entries : [];   // not harvested yet, or offline: stale beats gone
  }
}

/* Pages first — but a repo created seconds ago has no Pages deployment yet,
   and raw.githubusercontent serves the same bytes (CORS included) instantly.
   The fallback is what makes "create the repo, reload the player, the channel
   is there" true with zero wait. */
async function fetchFollowChannel(entry) {
  try { return await fetchChannel(entry); }
  catch (e) {
    if (!entry.alt) throw e;
    return await fetchChannel({ id: entry.id, url: entry.alt, repo: entry.repo });
  }
}

async function loadFollows() {
  const perOwner = await Promise.all((state.follows || []).map(ownerEntries));
  const settled = await Promise.allSettled(perOwner.flat().map(fetchFollowChannel));
  let joined = 0;
  for (const s of settled) {
    if (s.status !== "fulfilled") continue;
    const c = s.value;
    if (CHANNELS.some(x => x.id === c.id)) continue;   // already in the registry or added by URL
    CHANNELS.push(c); joined++;
    /* Auto-subscribe only the FIRST time a channel is seen, so unsubscribing
       one of a followed owner's channels sticks across reloads. */
    if (!state.followSeen.includes(c.id)) {
      state.followSeen.push(c.id);
      if (state.subs && !state.subs.includes(c.id)) state.subs.push(c.id);
    }
  }
  if (joined) save();
  return joined;
}

/* The snapshot belongs to the PLAYER, not to a channel: it is resolved against
   this page the way channels.json is, never against a channel.json's own URL.
   It is fetched without being awaited anywhere, because route() already sits
   behind the channel loads — putting a second host in front of first paint
   would mean a slow metrics server is a blank player. */
async function loadMetrics() {
  try {
    const r = await fetch(absolutise("state/metrics.json", location.href), { cache: "no-cache" });
    if (!r.ok) return;                 // no snapshot published yet — that is a valid state
    METRICS = indexMetrics(await r.json());
  } catch { return; }                  // offline, or somebody's JSON has a comma in it
  if (METRICS) applyMetrics();
}

/* Patch what is already on screen rather than re-running route(): a re-render
   would tear down a playing <video> and start it over. Both surfaces are
   additive — the pill is absolutely positioned inside the thumbnail and the
   community block is the last element in the watch column — so nothing that is
   already laid out moves when a late snapshot lands. */
function applyMetrics() {
  const slot = $("#community");
  if (slot && !slot.innerHTML) slot.innerHTML = communityHTML(mfind(slot.dataset.vk));
  document.querySelectorAll(".card[data-vk]").forEach(a => {
    const wrap = $(".thumbwrap", a);
    if (!wrap || $(".score", wrap)) return;
    const pill = scorePillHTML(mfind(a.dataset.vk));
    if (pill) wrap.insertAdjacentHTML("beforeend", pill);
  });
}

async function boot() {
  await loadLegacyPolicy();
  let registry = { channels: [] };
  try {
    const r = await fetch("channels.json", { cache: "no-cache" });
    if (r.ok) registry = await r.json();
  } catch {}

  const entries = [...(registry.channels || []), ...state.custom];
  const seen = new Set();
  const wanted = entries.filter(e => !seen.has(e.id) && seen.add(e.id));

  const settled = await Promise.allSettled(wanted.map(fetchChannel));
  CHANNELS = settled.filter(s => s.status === "fulfilled").map(s => s.value);
  const failed = settled.map((s, i) => s.status === "rejected" ? wanted[i].id : null).filter(Boolean);

  await loadFollows();   // followed owners' rappvision-* fleets; never throws, cached hourly

  if (state.subs === null) state.subs = CHANNELS.map(c => c.id);   // subscribe to all on first run
  rebuild();

  $("#foot-src").innerHTML =
    ` <a href="https://github.com/kody-w/rapp-vision">Source</a> · ` +
    `${CHANNELS.length} channel${CHANNELS.length === 1 ? "" : "s"}, ${ALL_VIDEOS.length} video${ALL_VIDEOS.length === 1 ? "" : "s"}.` +
    (VIDEOS.length !== ALL_VIDEOS.length ? ` ${VIDEOS.length} subscribed.` : "") +
    (failed.length ? ` <span style="color:var(--bad)">Offline: ${failed.map(esc).join(", ")}</span>` : "");

  route();
}

function rebuild() {
  const on = new Set(state.subs || CHANNELS.map(c => c.id));
  ALL_VIDEOS = CHANNELS.flatMap(c => c.videos || [])
    .sort((a, b) => String(b.published).localeCompare(String(a.published)));
  VIDEOS = ALL_VIDEOS.filter(v => on.has(v._ch.id));
}

boot();
loadMetrics();          // deliberately not awaited — it must never gate first paint
</script>
</body>
</html>
