<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAPP Vision — local-first video, hosted on GitHub</title>
<meta name="description" content="A local-first video platform. One HTML file, no server, no account, no tracking. Streams from any public GitHub repo; your history and playlists never leave your browser.">
<meta name="theme-color" content="#0a0d12">
<meta property="og:title" content="RAPP Vision">
<meta property="og:description" content="Local-first video. One HTML file, no server, no account. Streams straight from public GitHub repos.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
  :root{
    --bg:#0a0d12; --surface:#121722; --surface2:#182031; --line:#232c3d;
    --ink:#e9eef6; --dim:#93a3bd; --accent:#4da3ff; --accent-ink:#04121f;
    --good:#5fd39a; --bad:#ff7b72; --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-y:scroll}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- top bar ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(10,13,18,.92);
    backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.3px;flex-shrink:0}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7ee787);
    display:grid;place-items:center;color:#04121f;font-size:16px}
  .search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px}
  .search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none;min-width:0}
  .search input::placeholder{color:var(--dim)}
  .navbtn{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13.5px;white-space:nowrap}
  .navbtn:hover,.navbtn:focus-visible{border-color:var(--accent);outline:none}
  .navbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

  main{max-width:1440px;margin:0 auto;padding:22px 18px 90px}

  /* ---------- home ---------- */
  .hero{background:linear-gradient(120deg,rgba(77,163,255,.13),transparent 60%);
    border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:26px}
  .hero h1{margin:0 0 8px;font-size:clamp(20px,3.4vw,30px);letter-spacing:-.4px}
  .hero p{margin:0;color:var(--dim);max-width:78ch;font-size:14.5px}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 20px}
  .chip{padding:6px 14px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px;white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
  h2.sec{font-size:17px;margin:30px 0 14px;letter-spacing:-.2px}
  .grid{display:grid;gap:20px 16px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
  .card{text-align:left;display:block;border-radius:var(--radius);overflow:hidden}
  .thumbwrap{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;
    aspect-ratio:16/9;border:1px solid var(--line)}
  .thumbwrap.portrait{aspect-ratio:9/16;max-height:420px}
  .thumbwrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease}
  .card:hover .thumbwrap img,.card:focus-visible .thumbwrap img{transform:scale(1.045)}
  .card:focus-visible .thumbwrap{outline:2px solid var(--accent);outline-offset:2px}
  .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.84);
    padding:2px 7px;border-radius:5px;font:600 12px/1.5 var(--mono)}
  .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:var(--good);
    padding:2px 8px;border-radius:5px;font:600 11px/1.6 var(--mono)}
  .resume{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
  .resume i{display:block;height:100%;background:var(--bad)}
  .meta{padding:11px 3px 0}
  .meta h3{margin:0 0 5px;font-size:14.5px;line-height:1.35;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .sub{color:var(--dim);font-size:12.5px}
  .empty{color:var(--dim);padding:40px 0;text-align:center}

  /* ---------- watch ---------- */
  .watch{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:26px;align-items:start}
  .player{position:relative;background:#000;border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--line)}
  .player.portrait{max-width:420px;margin:0 auto}
  video{width:100%;display:block;background:#000;aspect-ratio:16/9}
  video.portrait{aspect-ratio:9/16}
  .vtitle{font-size:clamp(17px,2.3vw,21px);margin:16px 0 10px;line-height:1.3;letter-spacing:-.2px}
  .vrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--line)}
  .chan{display:flex;align-items:center;gap:10px;margin-right:auto}
  .chan{min-width:0}
  .chan>span{min-width:0;overflow-wrap:anywhere}
  .grid>div{min-width:0;overflow-wrap:anywhere}
  .chan .av{width:38px;height:38px;border-radius:50%;background:var(--surface2);
    display:grid;place-items:center;font-size:18px;border:1px solid var(--line)}
  .chan b{display:block;font-size:14px}
  .chan span{color:var(--dim);font-size:12.5px}
  .desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 17px;margin-top:16px;white-space:pre-wrap;font-size:14px;color:#cfd9e8}
  .desc .stat{color:var(--dim);font-size:12.5px;margin-bottom:10px;font-family:var(--mono)}
  .chapters{margin-top:18px}
  .chapters ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .chapters li button{width:100%;display:flex;gap:13px;align-items:baseline;
    padding:9px 12px;border-radius:9px;text-align:left;font-size:13.7px;color:var(--dim)}
  .chapters li button:hover{background:var(--surface)}
  .chapters li button.on{background:var(--surface2);color:var(--ink)}
  .chapters time{font:600 12.5px/1.5 var(--mono);color:var(--accent);flex-shrink:0}
  aside h3{font-size:14px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .up{display:flex;gap:11px;margin-bottom:13px;text-align:left;width:100%;border-radius:9px}
  .up:hover{background:var(--surface)}
  .up .t{width:150px;flex-shrink:0;position:relative;border-radius:8px;overflow:hidden;
    aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
  .up .t img{width:100%;height:100%;object-fit:cover}
  .up .i h4{margin:0 0 4px;font-size:13.4px;line-height:1.35;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .up .i span{color:var(--dim);font-size:12px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{padding:7px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px}
  .tbtn:hover{border-color:var(--accent)}
  .tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

  /* ---------- misc ---------- */
  .note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0;padding:16px 19px;margin:26px 0;font-size:14px;color:#cfd9e8}
  .note b{color:var(--ink)}
  code{font-family:var(--mono);font-size:.92em;background:var(--surface2);
    padding:1px 6px;border-radius:5px}
  footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 18px 40px;
    color:var(--dim);font-size:13px;max-width:1440px;margin-left:auto;margin-right:auto}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;
    font-size:13.5px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
  .toast.show{opacity:1}

  .stage{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);aspect-ratio:16/10}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .stage .card3{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
    padding:6%;background:#080c13;gap:10px}
  .stage .card3 h2{font-size:clamp(20px,3.6vw,40px);margin:0;letter-spacing:-.5px}
  .stage .card3 p{margin:0;color:var(--accent);font-size:clamp(14px,1.9vw,21px)}
  .stage .card3 small{color:var(--dim);font-size:13px;max-width:60ch;margin:8px auto 0;line-height:1.5}
  .stage .l3{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;
    background:linear-gradient(transparent,rgba(4,7,12,.93) 32%);pointer-events:none}
  .stage .l3 b{display:block;font-size:clamp(15px,2vw,23px)}
  .stage .l3 .bn{color:var(--accent);font-size:12.5px}
  .stage .l3 .bg{color:var(--bad);font-size:13.5px;margin-top:5px}
  .stage .l3 .fx{color:var(--good);font-size:12.5px;font-family:var(--mono);margin-top:2px}
  .stage .shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .28s;pointer-events:none}
  .lbar{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);
    border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius)}
  .lbar .scrub{flex:1;height:6px;border-radius:3px;background:var(--surface2);position:relative;cursor:pointer}
  .lbar .scrub i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;display:block}
  .lbar time{font:600 12.5px/1 var(--mono);color:var(--dim)}
  .livetag{background:var(--good);color:#04140c;font:700 10.5px/1 var(--mono);
    padding:4px 7px;border-radius:4px;letter-spacing:.06em}
  @media (max-width:980px){
    .watch{grid-template-columns:1fr}
    aside{margin-top:10px}
  }
  @media (max-width:620px){
    .bar{flex-wrap:wrap;padding:10px 14px}
    .search{order:3;width:100%;max-width:none;flex-basis:100%}
    main{padding:16px 14px 80px}
    .grid{grid-template-columns:1fr;gap:22px}
    .up .t{width:120px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="#/" aria-label="RAPP Vision home">
      <span class="logo">▶</span><span>RAPP&nbsp;Vision</span>
    </a>
    <div class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Search videos, tags, chapters…" aria-label="Search">
    </div>
    <button class="navbtn" id="nav-ch">Channels</button>
    <button class="navbtn" id="nav-lib">Library</button>
    <button class="navbtn" id="nav-about">About</button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <strong>RAPP Vision</strong> — local-first video. One HTML file, no server, no account, no tracking.
  Your watch history, resume points and playlists live in <code>localStorage</code> and never leave the browser.
  Video is streamed straight from public GitHub repos.
  <span id="foot-src"></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * RAPP Vision — a local-first video platform.
 *
 * No backend. The catalog is a JSON file; the media are ordinary files
 * in a public repo. Publishing a video means committing a file and
 * adding an entry. Everything personal (history, resume position,
 * watch-later, likes) stays in localStorage and is exportable as JSON.
 * ------------------------------------------------------------------ */

const LS = "rapp_vision_v1";
const $  = (s, r = document) => r.querySelector(s);
const app = $("#app");

/* Every channel is just a channel.json in some public repo. Sources and
   thumbnails inside it resolve relative to THAT file's URL, which is what
   lets a channel live anywhere and still play here. */
let CHANNELS = [];        // loaded channel objects, each with .videos
let VIDEOS  = [];         // flattened, each video carries ._ch
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS) || "{}");
    return { history: s.history || {}, later: s.later || [], liked: s.liked || [],
             rate: s.rate || 1, subs: s.subs || null, custom: s.custom || [] };
  } catch { return { history: {}, later: [], liked: [], rate: 1, subs: null, custom: [] }; }
}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} }

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1900);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* A channel's avatar may be a glyph ("\ud83e\udea8") or an image URL. Render the
     right thing for each — dumping a URL as text is how it used to spill across
     the page. Anything that isn't a URL is treated as a glyph. */
  const isUrl = (v) => /^(https?:\/\/|\.{0,2}\/)/.test(String(v || "").trim());
  const avatarHTML = (av, px) => {
    const size = px || 38;
    const box = `width:${size}px;height:${size}px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);flex:0 0 auto;overflow:hidden`;
    if (isUrl(av)) {
      return `<span style="${box};display:block"><img src="${esc(av)}" alt="" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block"></span>`;
    }
    return `<span style="${box};display:grid;place-items:center;font-size:${Math.round(size * 0.5)}px">${esc(av || "\ud83d\udcfa")}</span>`;
  };

function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
           : `${m}:${String(s).padStart(2, "0")}`;
}
function ago(d) {
  const days = Math.floor((Date.now() - new Date(d + "T12:00:00").getTime()) / 864e5);
  if (isNaN(days)) return "";
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  const mo = Math.floor(days / 30);
  return mo < 12 ? mo + (mo === 1 ? " month ago" : " months ago")
                 : Math.floor(mo / 12) + " year" + (mo >= 24 ? "s" : "") + " ago";
}
const byId = id => VIDEOS.find(v => v.id === id);
const prog = id => { const h = state.history[id]; return h && h.d ? Math.min(1, h.t / h.d) : 0; };

/* ---------------------------- views ---------------------------- */

function cardHTML(v) {
  const p = prog(v.id), portrait = v.orientation === "portrait";
  return `<a class="card" href="#/watch/${encodeURIComponent(v.id)}">
    <div class="thumbwrap${portrait ? " portrait" : ""}">
      <img src="${esc(v.thumb)}" alt="" loading="lazy" decoding="async">
      ${portrait ? '<span class="badge">SHORT</span>' : ""}
      <span class="dur">${fmt(v.duration)}</span>
      ${p > 0.02 && p < 0.97 ? `<span class="resume"><i style="width:${(p * 100).toFixed(1)}%"></i></span>` : ""}
    </div>
    <div class="meta">
      <h3>${esc(v.title)}</h3>
      <div class="sub">${esc(v._ch.name)} · ${fmt(v.duration)} · ${esc(ago(v.published))}${v.live ? ' · <b style="color:var(--good)">LIVE</b>' : ""}</div>
    </div>
  </a>`;
}

function matches(v, q) {
  if (!q) return true;
  const hay = [v.title, v.description, (v.tags || []).join(" "),
               (v.chapters || []).map(c => c.label).join(" ")].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function viewHome(q = "", tag = "") {
  const list = VIDEOS.filter(v => matches(v, q) && (!tag || (v.tags || []).includes(tag)));
  const tags = [...new Set(VIDEOS.flatMap(v => v.tags || []))].sort();
  const cont = VIDEOS.filter(v => { const p = prog(v.id); return p > 0.02 && p < 0.97; });

  app.innerHTML = `
    ${q || tag ? "" : `<section class="hero">
      <h1>${esc(CHANNELS[0] ? (CHANNELS[0].tagline || CHANNELS[0].about || "Local-first video.") : "Local-first video.")}</h1>
      <p>Local-first video. This whole site is one HTML file with no backend and no account —
         the catalog is a JSON file and the media are ordinary files in a public GitHub repo.
         Your history, resume points and playlists stay in this browser.</p>
    </section>`}
    ${tags.length ? `<div class="chips" role="group" aria-label="Filter by tag">
      <button class="chip${tag ? "" : " on"}" data-tag="">All</button>
      ${tags.map(t => `<button class="chip${t === tag ? " on" : ""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
    </div>` : ""}
    ${cont.length && !q && !tag ? `<h2 class="sec">Continue watching</h2>
      <div class="grid">${cont.map(cardHTML).join("")}</div>` : ""}
    <h2 class="sec">${q ? `Results for “${esc(q)}”` : tag ? `#${esc(tag)}` : "All videos"} · ${list.length}</h2>
    ${list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
                  : `<p class="empty">Nothing matches that. Try clearing the search.</p>`}`;

  app.querySelectorAll(".chip").forEach(b =>
    b.onclick = () => viewHome($("#q").value.trim(), b.dataset.tag));
}

/* ---------------------------------------------------------------- *
 * Live replay — a video that is a script, not a file.
 *
 * Each scene loads the REAL application in an iframe and replays the
 * recorded interactions against a clock. Every GitHub Pages repo is
 * served from one origin, so the player can dispatch real events into
 * the frame. Play/pause/seek behave normally, but the app is genuinely
 * running — pause and you can take over.
 *
 * Cross-origin (or a browser that blocks it) degrades to captions;
 * channels publish a static cut alongside anyway.
 * ---------------------------------------------------------------- */
function mountLive(v, host) {
  const scenes = (v.live.scenes || []).slice().sort((a, b) => a.t - b.t);
  const total = v.duration || scenes.reduce((m, s) => Math.max(m, s.t + (s.dur || 0)), 0);

  host.innerHTML = `
    <div class="stage" id="stage"><div class="shade" id="shade"></div></div>
    <div class="lbar">
      <span class="livetag">LIVE</span>
      <button class="tbtn" id="lp">&#9654; Play</button>
      <time id="lt">0:00</time>
      <div class="scrub" id="ls"><i style="width:0%"></i></div>
      <time id="ld">${fmt(total)}</time>
      <button class="tbtn" id="lr" title="Restart">&#8635;</button>
    </div>`;

  const stage = $("#stage", host), shade = $("#shade", host);
  let clock = 0, playing = false, raf = 0, cur = -1, frame = null, fired = new Set(), last = 0;
  let anchor = null, anchorPoll = 0;

  const sceneAt = t => { let s = null; scenes.forEach((x, i) => { if (t >= x.t) { s = x; s._i = i; } }); return s; };

  /* An app is not ready when its iframe fires load - it is ready when its
     controls work. Apex spends ~3s building scenery and ships START ENGINE
     disabled until it is done, and that delay varies with the machine. Timing a
     recorded script from scene start therefore desyncs: measured here, engine
     start wandered between 0:11 and 0:14 across runs, which is the difference
     between a clean lap and a crash. So a scene may declare what "ready" means,
     and every action time is measured from the moment it comes true. Same
     script, same drive, fast laptop or slow phone. */
  function armAnchor(s) {
    clearInterval(anchorPoll); anchor = null;
    if (!s || !s.app) { anchor = clock; return; }
    const want = s.ready, t0 = performance.now();
    anchorPoll = setInterval(() => {
      if (!frame) return;
      let doc; try { doc = frame.contentDocument; } catch (e) { return; }
      if (!doc || doc.readyState !== "complete") return;
      let ok = true;
      if (want) {
        let el = null;
        try { el = want.selector ? doc.querySelector(want.selector)
                  : want.text ? findText(doc, want.text) : null; } catch (e) {}
        ok = want.enabled === false ? !!el : clickable(el);
      }
      if (ok || performance.now() - t0 > 30000) { clearInterval(anchorPoll); anchor = clock; }
    }, 120);
  }

  function renderScene(s) {
    [...stage.children].forEach(c => { if (c.id !== "shade") c.remove(); });
    frame = null;
    armAnchor(s);
    if (s.card) {
      const d = document.createElement("div");
      d.className = "card3";
      d.innerHTML = `<h2>${esc(s.card.title || "")}</h2><p>${esc(s.card.sub || "")}</p>` +
                    (s.card.note ? `<small>${esc(s.card.note)}</small>` : "");
      stage.appendChild(d);
      return;
    }
    if (s.app) {
      frame = document.createElement("iframe");
      frame.src = s.app;
      frame.setAttribute("title", (s.lower && s.lower.title) || "application");
      frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
      stage.appendChild(frame);
      if (s.lower) {
        const l = document.createElement("div");
        l.className = "l3";
        l.innerHTML = `<b>${esc(s.lower.title || "")} <span class="bn">${esc(s.lower.bench || "")}</span></b>` +
          (s.lower.bug ? `<div class="bg">&#9679; ${esc(s.lower.bug)}</div>` : "") +
          (s.lower.fix ? `<div class="fx">&#10003; ${esc(s.lower.fix)}</div>` : "");
        stage.appendChild(l);
      }
    }
  }

  /* A real click is a sequence of pointer/mouse events on the element that
     is actually under the cursor. Calling el.click() on a wrapper misses
     handlers bound to a child or to the document, which is exactly how the
     first version silently failed to press START ENGINE. */
  function realClick(el) {
    const doc = frame.contentDocument, win = frame.contentWindow;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const target = doc.elementFromPoint(x, y) || el;
    const opts = { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, view: win };
    /* Watch, in the capture phase, whether a click actually lands. The old
       "belt and braces" el.click() ran unconditionally, so every control got
       activated twice: the camera button cycled Chase -> Hood, skipping
       Cockpit, and Photo mode toggled on and straight back off. A fallback must
       only fire when the real thing did not. */
    let landed = false;
    const spy = () => { landed = true; };
    doc.addEventListener("click", spy, true);
    ["pointerdown", "mousedown", "pointerup", "mouseup", "click"].forEach(type => {
      const Ctor = type.startsWith("pointer") && win.PointerEvent ? win.PointerEvent : win.MouseEvent;
      try { target.dispatchEvent(new Ctor(type, opts)); } catch (e) {}
    });
    doc.removeEventListener("click", spy, true);
    if (!landed) { try { el.click(); } catch (e) {} }
  }

  /* Visible is not the same as clickable. Apps that boot asynchronously render
     their controls disabled while assets load. Apex ships its start button as
     `<button id="startBtn" disabled>Start Engine</button>`. The first version
     found that button, saw width>0, clicked it, and returned satisfied. The
     click did nothing, because a disabled button swallows events. So readiness
     means visible AND enabled, and we keep waiting until it is. */
  function clickable(el) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return false;
    if (el.disabled) return false;
    if (el.getAttribute && el.getAttribute("aria-disabled") === "true") return false;
    if (el.closest && el.closest("[disabled],[aria-disabled=true]")) return false;
    try {
      const cs = frame.contentWindow.getComputedStyle(el);
      if (cs.pointerEvents === "none" || cs.visibility === "hidden" || +cs.opacity === 0) return false;
    } catch (e) {}
    return true;
  }

  /* Find a control by its visible label. Controls first, then any element:
     matching a <div> that merely *contains* the word would shadow the button. */
  function findText(doc, want) {
    const w = String(want).toLowerCase();
    const scan = sel => [...doc.querySelectorAll(sel)]
      .find(e => (e.innerText || e.value || "").trim().toLowerCase().includes(w)
                 && e.getBoundingClientRect().width > 0);
    return scan("button,a,[role=button],input,[onclick]") || scan("div,span,li") || null;
  }

  function retryClick(find, budgetMs) {
    const t0 = performance.now();
    const attempt = () => {
      let el = null;
      try { el = find(); } catch (e) { el = null; }
      if (clickable(el)) { realClick(el); return; }
      if (performance.now() - t0 < budgetMs) setTimeout(attempt, 250);
    };
    attempt();
  }

  function act(a) {
    if (!frame) return;
    let doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    const win = frame.contentWindow;
    const hit = () => {
      if (a.selector) return doc.querySelector(a.selector);
      if (a.text) return findText(doc, a.text);

      return null;
    };
    const mouse = (type, x, y) => {
      const el = doc.elementFromPoint(x, y);
      el && el.dispatchEvent(new win.MouseEvent(type, { bubbles: true, clientX: x, clientY: y, buttons: type === "mouseup" ? 0 : 1 }));
    };
    /* A KeyboardEvent carries both `code` (the physical key) and `key` (the
       character it produces). Apps disagree about which one they read - Apex
       uses keys[e.key.toLowerCase()]. A scene author should not have to know
       that, so given a `code` we derive the `key` the app expects. Sending
       code:"KeyW" with key:"KeyW" sets keys["keyw"], which nothing reads, and
       the car silently never moves. */
    const keyFromCode = code => {
      if (!code) return "";
      let m;
      if ((m = /^Key([A-Z])$/.exec(code))) return m[1].toLowerCase();
      if ((m = /^Digit(\d)$/.exec(code))) return m[1];
      if ((m = /^Numpad(\d)$/.exec(code))) return m[1];
      if (code === "Space") return " ";
      if (code === "Enter" || code === "NumpadEnter") return "Enter";
      if (/^(Arrow|Tab|Backspace|Delete|Home|End|Page|Shift|Control|Alt|Meta|Escape)/.test(code))
        return code.replace(/(Left|Right)$/, "");
      return code;
    };
    const kev = (type, code, key) => {
      const k = key || keyFromCode(code);
      return new win.KeyboardEvent(type, {
        code, key: k, bubbles: true, cancelable: true, composed: true,
        keyCode: k.length === 1 ? k.toUpperCase().charCodeAt(0) : 0
      });
    };
    try {
      switch (a.do) {
        // Apps boot asynchronously — a Three.js scene may still be "Planting
        // scenery…" when the cue fires. Retry briefly instead of silently
        // missing the click, which is exactly what happened the first time.
        case "click":   { retryClick(hit, 20000); break; }
        case "keydown": doc.dispatchEvent(kev("keydown", a.code, a.key)); break;
        case "keyup":   doc.dispatchEvent(kev("keyup", a.code, a.key)); break;
        case "key":     doc.dispatchEvent(kev("keydown", a.code, a.key));
                        doc.dispatchEvent(kev("keyup", a.code, a.key)); break;
        case "type":    [...(a.text || "")].forEach(ch => {
                          const el = doc.activeElement || doc.body;
                          ["keydown", "keypress", "keyup"].forEach(tt => el.dispatchEvent(kev(tt, "Key", ch)));
                        }); break;
        case "drag":    { const f = a.from || [0, 0], to = a.to || [0, 0];
                          mouse("mousedown", f[0], f[1]);
                          for (let i = 1; i <= 8; i++) mouse("mousemove", f[0] + (to[0] - f[0]) * i / 8, f[1] + (to[1] - f[1]) * i / 8);
                          mouse("mouseup", to[0], to[1]); break; }
      }
    } catch (e) { /* app not ready or blocked — never break playback */ }
  }

  function paint() {
    $("#lt", host).textContent = fmt(clock);
    $("#ls i", host).style.width = (clock / total * 100).toFixed(2) + "%";
    const s = sceneAt(clock);
    if (s) shade.style.opacity = clock > s.t + (s.dur || 0) - 0.5 ? 0.55 : 0;
  }

  function seek(t) {
    clock = Math.max(0, Math.min(total, t));
    const s = sceneAt(clock);
    if (s && s._i !== cur) { cur = s._i; fired.clear(); renderScene(s); }
    if (s) (s.actions || []).forEach((a, i) => {
      const key = cur + ":" + i;
      const due = anchor === null ? Infinity : anchor + a.at;
      if (clock >= due && !fired.has(key)) { fired.add(key); act(a); }
    });
    paint();
    state.history[v.id] = { t: clock, d: total, at: Date.now() };
    save();
  }

  function tick(now) {
    if (!playing) return;
    if (last) seek(clock + (now - last) / 1000);
    last = now;
    if (clock >= total) { pause(); return; }
    raf = requestAnimationFrame(tick);
  }
  function play()  { if (playing) return; playing = true; last = 0; $("#lp", host).innerHTML = "&#10074;&#10074; Pause"; raf = requestAnimationFrame(tick); }
  function pause() { playing = false; cancelAnimationFrame(raf); $("#lp", host).innerHTML = "&#9654; Play"; }

  $("#lp", host).onclick = () => playing ? pause() : play();
  $("#lr", host).onclick = () => { cur = -1; seek(0); };
  $("#ls", host).onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    cur = -1; seek((e.clientX - r.left) / r.width * total);
  };

  const h = state.history[v.id];
  seek(h && h.t > 2 && h.t < total - 4 ? h.t : 0);

  return { keys: e => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "k") { e.preventDefault(); playing ? pause() : play(); }
    else if (k === "arrowright" || k === "l") { cur = -1; seek(clock + 10); }
    else if (k === "arrowleft"  || k === "j") { cur = -1; seek(clock - 10); }
  } };
}

function bindCommon(id) {
  $("#b-like").onclick = e => {
    const i = state.liked.indexOf(id);
    if (i < 0) { state.liked.push(id); e.target.classList.add("on"); e.target.textContent = "♥ Liked"; }
    else { state.liked.splice(i, 1); e.target.classList.remove("on"); e.target.textContent = "♥ Like"; }
    save(); toast(i < 0 ? "Liked" : "Removed like");
  };
  $("#b-later").onclick = e => {
    const i = state.later.indexOf(id);
    if (i < 0) { state.later.push(id); e.target.classList.add("on"); e.target.textContent = "✓ Saved"; }
    else { state.later.splice(i, 1); e.target.classList.remove("on"); e.target.textContent = "+ Watch later"; }
    save(); toast(i < 0 ? "Saved to Watch later" : "Removed");
  };
  $("#b-link").onclick = () => {
    const url = location.href;
    (navigator.clipboard?.writeText(url) ?? Promise.reject())
      .then(() => toast("Link copied")).catch(() => toast(url));
  };
}

function viewWatch(id) {
  const v = byId(id);
  if (!v) { app.innerHTML = `<p class="empty">That video isn’t in this catalog.</p>`; return; }
  const portrait = v.orientation === "portrait";
  const isLive = !!(v.live && !(v.sources && v.sources.length));
  const up = VIDEOS.filter(x => x.id !== id);
  const liked = state.liked.includes(id), later = state.later.includes(id);

  app.innerHTML = `
  <div class="watch">
    <div>
      <div id="host">${isLive ? "" : `<div class="player${portrait ? " portrait" : ""}">
        <video id="v" controls playsinline preload="metadata"
               poster="${esc(v.thumb)}" class="${portrait ? "portrait" : ""}">
          ${v.sources.map(s => `<source src="${esc(s.src)}" type='${esc(s.type)}'>`).join("")}
          Your browser can’t play this video.
          <a href="${esc(v.sources[0].src)}">Download it instead.</a>
        </video>
      </div>`}</div>
      <h1 class="vtitle">${esc(v.title)}</h1>
      <div class="vrow">
        <div class="chan">
          ${avatarHTML(v._ch.avatar, 38)}
          <span><a href="#/channel/${encodeURIComponent(v._ch.id)}"><b>${esc(v._ch.name)}</b></a><span>${esc(v._ch.handle)}</span></span>
        </div>
        <div class="toolbar">
          <button class="tbtn${liked ? " on" : ""}" id="b-like">♥ ${liked ? "Liked" : "Like"}</button>
          <button class="tbtn${later ? " on" : ""}" id="b-later">${later ? "✓ Saved" : "+ Watch later"}</button>
          ${isLive ? "" : `<button class="tbtn" id="b-speed">Speed ${state.rate}×</button>`}
          ${isLive
            ? `<a class="tbtn" href="${esc((v.live.scenes || []).map(s => s.app).filter(Boolean)[0] || "#")}" target="_blank" rel="noopener">Open the app ↗</a>`
            : `<a class="tbtn" href="${esc(v.sources[0].src)}" download>↓ Download</a>`}
          <button class="tbtn" id="b-link">Copy link</button>
        </div>
      </div>
      <div class="desc">
        <div class="stat">${[esc(ago(v.published)), fmt(v.duration), (v.width && v.height ? v.width + "×" + v.height : ""), (v.tags || []).map(t => "#" + t).join(" ")].filter(Boolean).join(" · ")}</div>
        ${esc(v.description)}
      </div>
      ${(v.chapters || []).length ? `<div class="chapters">
        <h2 class="sec" style="margin-bottom:8px">Chapters</h2>
        <ol>${v.chapters.map((c, i) => `<li><button data-t="${c.t}" data-i="${i}">
          <time>${fmt(c.t)}</time><span>${esc(c.label)}</span></button></li>`).join("")}</ol>
      </div>` : ""}
    </div>
    <aside>
      <h3>Up next</h3>
      ${up.map(x => `<a class="up" href="#/watch/${encodeURIComponent(x.id)}">
        <span class="t"><img src="${esc(x.thumb)}" alt="" loading="lazy"></span>
        <span class="i"><h4>${esc(x.title)}</h4><span>${esc(x._ch.name)} · ${fmt(x.duration)}</span></span>
      </a>`).join("")}
      <div class="note" style="margin-top:22px">
        <b>Nothing here phones home.</b> Playback position and playlists are stored locally.
        Export them any time from <a href="#/library">Library</a>.
      </div>
    </aside>
  </div>`;

  bindCommon(id);

  if (isLive) {                       // a script, not a file
    const live = mountLive(v, $("#host"));
    app._keys = live.keys;
    document.addEventListener("keydown", app._keys);
    return;
  }

  const vid = $("#v");
  vid.playbackRate = state.rate;

  // resume where you left off
  const h = state.history[id];
  if (h && h.t > 3 && h.d && h.t < h.d - 8) {
    const goto = h.t;
    vid.addEventListener("loadedmetadata", () => { vid.currentTime = goto; }, { once: true });
    toast(`Resuming at ${fmt(goto)}`);
  }

  let last = 0;
  vid.addEventListener("timeupdate", () => {
    const now = Date.now();
    if (now - last < 1000) return;              // throttle writes
    last = now;
    if (vid.duration) {
      state.history[id] = { t: vid.currentTime, d: vid.duration, at: now };
      save();
    }
    const btns = app.querySelectorAll(".chapters button");
    if (btns.length) {
      let active = 0;
      (v.chapters || []).forEach((c, i) => { if (vid.currentTime >= c.t - 0.25) active = i; });
      btns.forEach((b, i) => b.classList.toggle("on", i === active));
    }
  });

  app.querySelectorAll(".chapters button").forEach(b => b.onclick = () => {
    vid.currentTime = +b.dataset.t;
    vid.play().catch(() => {});
  });

  $("#b-speed").onclick = e => {
    const steps = [0.75, 1, 1.25, 1.5, 1.75, 2];
    state.rate = steps[(steps.indexOf(state.rate) + 1) % steps.length];
    vid.playbackRate = state.rate; e.target.textContent = `Speed ${state.rate}×`; save();
  };
  // YouTube-style keyboard shortcuts
  app._keys = e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === " " || k === "k") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    else if (k === "arrowright" || k === "l") vid.currentTime += 10;
    else if (k === "arrowleft" || k === "j") vid.currentTime -= 10;
    else if (k === "m") vid.muted = !vid.muted;
    else if (k === "f") (document.fullscreenElement ? document.exitFullscreen() : vid.requestFullscreen?.());
    else if (k >= "0" && k <= "9" && vid.duration) vid.currentTime = vid.duration * (+k / 10);
  };
  document.addEventListener("keydown", app._keys);
}

function viewLibrary() {
  const watched = Object.entries(state.history)
    .sort((a, b) => (b[1].at || 0) - (a[1].at || 0))
    .map(([id]) => byId(id)).filter(Boolean);
  const sec = (title, list, empty) => `<h2 class="sec">${title} · ${list.length}</h2>
    ${list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
                  : `<p class="empty">${empty}</p>`}`;

  app.innerHTML = `
    <section class="hero"><h1>Your library</h1>
      <p>Stored in this browser only. Nothing is uploaded, and there is no account to create.
         Export it as JSON to move it to another device.</p>
      <div class="toolbar" style="margin-top:16px">
        <button class="tbtn" id="ex">↓ Export JSON</button>
        <button class="tbtn" id="im">↑ Import JSON</button>
        <button class="tbtn" id="cl">Clear history</button>
      </div>
    </section>
    ${sec("Watch later", state.later.map(byId).filter(Boolean), "Nothing saved yet.")}
    ${sec("Liked", state.liked.map(byId).filter(Boolean), "Nothing liked yet.")}
    ${sec("Recently watched", watched, "You haven’t watched anything yet.")}`;

  $("#ex").onclick = () => {
    const blob = new Blob([JSON.stringify({ schema: "rapp-vision-library/1.0", exported: new Date().toISOString(), ...state }, null, 2)],
      { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rapp-vision-library.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Exported");
  };
  $("#im").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          state = { history: d.history || {}, later: d.later || [], liked: d.liked || [],
                    rate: d.rate || 1, catalogs: d.catalogs || [] };
          save(); toast("Library imported"); viewLibrary();
        } catch { toast("That file isn’t a valid library export"); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $("#cl").onclick = () => {
    if (!confirm("Clear watch history, resume points, likes and watch-later?")) return;
    state = { history: {}, later: [], liked: [], rate: 1, catalogs: [] };
    save(); toast("Cleared"); viewLibrary();
  };
}

function viewChannel(id) {
  const c = CHANNELS.find(x => x.id === id);
  if (!c) { app.innerHTML = `<p class="empty">No such channel in this network.</p>`; return; }
  const subbed = (state.subs || []).includes(id);
  const vids = (c.videos || []).slice().sort((a, b) => String(b.published).localeCompare(String(a.published)));
  app.innerHTML = `
    <section class="hero">
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        ${avatarHTML(c.avatar, 64)}
        <div style="flex:1;min-width:200px">
          <h1 style="margin:0">${esc(c.name)}</h1>
          <p style="margin:4px 0 0">${esc(c.handle || "")} \u00b7 ${vids.length} video${vids.length === 1 ? "" : "s"}</p>
        </div>
        <button class="tbtn${subbed ? " on" : ""}" id="b-sub">${subbed ? "\u2713 Subscribed" : "+ Subscribe"}</button>
      </div>
      <p style="margin-top:14px">${esc(c.tagline || c.about || "")}</p>
      <div class="toolbar" style="margin-top:14px">
        ${(Array.isArray(c.links) ? c.links : []).map(l => `<a class="tbtn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} \u2197</a>`).join("")}
        <a class="tbtn" href="${esc(c._url)}" target="_blank" rel="noopener">channel.json \u2197</a>
      </div>
    </section>
    <div class="grid">${vids.map(cardHTML).join("")}</div>`;
  $("#b-sub").onclick = e => {
    const i = (state.subs || []).indexOf(id);
    if (i < 0) state.subs.push(id); else state.subs.splice(i, 1);
    save(); rebuild();
    e.target.classList.toggle("on", i < 0);
    e.target.textContent = i < 0 ? "\u2713 Subscribed" : "+ Subscribe";
    toast(i < 0 ? "Subscribed" : "Unsubscribed");
  };
}

         Subscribe to what you want \u2014 that choice lives in this browser, not on a server. You can add

      </div>

    <div class="grid">
      ${CHANNELS.map(c => {
        const on = (state.subs || []).includes(c.id);
        return `<div style="padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)">
          <div>${avatarHTML(c.avatar, 44)}</div>
          <h3 style="margin:10px 0 4px;font-size:16px">${esc(c.name)}</h3>

          <p style="color:var(--dim);font-size:13px;margin:10px 0 14px">${esc(c.tagline || c.about || "")}</p>
          <div class="toolbar">
            <a class="tbtn" href="#/channel/${encodeURIComponent(c.id)}">Open</a>

  });
  $("#add").onclick = async () => {

      const c = await fetchChannel({ id: "custom-" + Date.now(), url });

function viewAbout() {
  app.innerHTML = `
  <section class="hero"><h1>Why this exists</h1>
    <p>Publishing a video usually means handing it to a platform that owns the distribution,
       the recommendations and the audience. This is the other option: the video is a file in a
       repo you control, and the player is one HTML file sitting next to it.</p></section>

  <div class="note"><b>There is no server.</b> This page is static. The catalog is
    <code>videos.json</code>; the media are ordinary files served over GitHub Pages with byte-range
    support, which is all a <code>&lt;video&gt;</code> element needs in order to stream and seek.</div>

  <h2 class="sec">Publishing a video</h2>
  <div class="desc">1. Commit the file to a public repo.
2. Add an entry to <code>videos.json</code> — title, thumbnail, duration, sources, chapters.
3. Push.

That's it. Sources may be relative paths or absolute <code>raw.githubusercontent.com</code> URLs, so a
catalog can point at media living in a completely different repo.</div>

  <h2 class="sec">What it does</h2>
  <div class="desc">• Home grid, search across titles, descriptions, tags and chapter labels
• Watch view with clickable chapters that highlight as the video plays
• Resume where you left off, per video
• Watch later, likes, recently watched
• Playback speed, and YouTube-style keys — space/k, j/l, ←/→, m, f, 0–9
• Both landscape and vertical (Shorts-style) videos
• Export and import your library as JSON</div>

  <h2 class="sec">What it deliberately doesn't do</h2>
  <div class="desc">No accounts. No cookies. No analytics. No recommendation engine deciding what you
see next. Nothing about what you watch leaves this browser — the entire "profile" is a
<code>localStorage</code> key you can read, export, or delete.</div>

  <div class="note" style="margin-top:26px"><b>Encoding tip.</b> Ship H.264/AAC in MP4 <em>and</em>
    VP9/Opus in WebM. Plenty of Chromium builds ship without proprietary codecs, and an MP4-only
    source is silently unplayable there — a bug found the hard way, by measuring rather than
    assuming.</div>`;
}

/* ---------------------------- router ---------------------------- */

function route() {
  document.removeEventListener("keydown", app._keys || (() => {}));
  const h = location.hash.replace(/^#\/?/, "");
  const [view, arg] = h.split("/");
  $("#nav-ch").classList.toggle("on", view === "channels" || view === "channel");
  $("#nav-lib").classList.toggle("on", view === "library");
  $("#nav-about").classList.toggle("on", view === "about");
  if (view === "watch" && arg) viewWatch(decodeURIComponent(arg));
  else if (view === "channel" && arg) viewChannel(decodeURIComponent(arg));
  else if (view === "channels") viewChannels();
  else if (view === "library") viewLibrary();
  else if (view === "about") viewAbout();
  else viewHome($("#q").value.trim());
  window.scrollTo(0, 0);
  app.focus({ preventScroll: true });
}

addEventListener("hashchange", route);
$("#nav-ch").onclick  = () => location.hash = "#/channels";
$("#nav-lib").onclick = () => location.hash = "#/library";
$("#nav-about").onclick = () => location.hash = "#/about";
$("#q").addEventListener("input", () => {
  if (!location.hash.startsWith("#/watch")) {
    if (location.hash !== "#/") location.hash = "#/";
    else viewHome($("#q").value.trim());
  }
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { location.hash = "#/"; viewHome($("#q").value.trim()); }
});

/* ---- network loader --------------------------------------------
   channels.json lists channel.json URLs. Each channel's media paths
   resolve against its own URL, so a channel can live in any repo.    */

function absolutise(url, base) {
  if (!url) return "";                 // absolutise(undefined) used to yield ".../undefined" and a real 404
  try { return new URL(url, base).href; } catch { return url; }
}

async function fetchChannel(entry) {
  const url = absolutise(entry.url, location.href);
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(entry.id + " HTTP " + r.status);
  const c = await r.json();
  c._url = url;
  c._repo = entry.repo || c.repo || "";
  /* Be forgiving about shape. Anyone can publish a channel, so one typo in
     someone else's JSON must not blank the network: `poster` is the obvious
     name for a thumbnail and people reach for it, and `links` is just as
     naturally written as an object as an array. Accept both, render one. */
  if (c.links && !Array.isArray(c.links)) {
    c.links = Object.keys(c.links).map(k => ({ label: k, url: c.links[k] }));
  }
  (c.videos || []).forEach(v => {
    v._ch = c;
    v.thumb = absolutise(v.thumb || v.poster, url);
    (v.sources || []).forEach(s => { s.src = absolutise(s.src, url); });
    if (v.live) (v.live.scenes || []).forEach(sc => {
      if (sc.app) sc.app = absolutise(sc.app, url);
    });
  });
  return c;
}

async function boot() {
  let registry = { channels: [] };
  try {
    const r = await fetch("channels.json", { cache: "no-cache" });
    if (r.ok) registry = await r.json();
  } catch {}

  const entries = [...(registry.channels || []), ...state.custom];
  const seen = new Set();
  const wanted = entries.filter(e => !seen.has(e.id) && seen.add(e.id));

  const settled = await Promise.allSettled(wanted.map(fetchChannel));
  CHANNELS = settled.filter(s => s.status === "fulfilled").map(s => s.value);
  const failed = settled.map((s, i) => s.status === "rejected" ? wanted[i].id : null).filter(Boolean);

  if (state.subs === null) state.subs = CHANNELS.map(c => c.id);   // subscribe to all on first run
  rebuild();

  $("#foot-src").innerHTML =
    ` <a href="https://github.com/kody-w/rapp-vision">Source</a> · ` +
    `${CHANNELS.length} channel${CHANNELS.length === 1 ? "" : "s"}, ${VIDEOS.length} video${VIDEOS.length === 1 ? "" : "s"}.` +
    (failed.length ? ` <span style="color:var(--bad)">Offline: ${failed.map(esc).join(", ")}</span>` : "");

  route();
}

function rebuild() {
  const on = new Set(state.subs || CHANNELS.map(c => c.id));
  VIDEOS = CHANNELS.filter(c => on.has(c.id))
    .flatMap(c => c.videos || [])
    .sort((a, b) => String(b.published).localeCompare(String(a.published)));
}

boot();
</script>
</body>
