<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAPP Vision — local-first video, hosted on GitHub</title>
<meta name="description" content="A local-first video platform. One HTML file, no server, no account, no tracking. Streams from any public GitHub repo; your history and playlists never leave your browser.">
<meta name="theme-color" content="#0a0d12">
<meta property="og:title" content="RAPP Vision">
<meta property="og:description" content="Local-first video. One HTML file, no server, no account. Streams straight from public GitHub repos.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<style>
  :root{
    --bg:#0a0d12; --surface:#121722; --surface2:#182031; --line:#232c3d;
    --ink:#e9eef6; --dim:#93a3bd; --accent:#4da3ff; --accent-ink:#04121f;
    --good:#5fd39a; --bad:#ff7b72; --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-y:scroll}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- top bar ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(10,13,18,.92);
    backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.3px;flex-shrink:0}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7ee787);
    display:grid;place-items:center;color:#04121f;font-size:16px}
  .search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px}
  .search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none;min-width:0}
  .search input::placeholder{color:var(--dim)}
  .navbtn{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13.5px;white-space:nowrap}
  .navbtn:hover,.navbtn:focus-visible{border-color:var(--accent);outline:none}
  .navbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

  main{max-width:1440px;margin:0 auto;padding:22px 18px 90px}

  /* ---------- home ---------- */
  .hero{background:linear-gradient(120deg,rgba(77,163,255,.13),transparent 60%);
    border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:26px}
  .hero h1{margin:0 0 8px;font-size:clamp(20px,3.4vw,30px);letter-spacing:-.4px}
  .hero p{margin:0;color:var(--dim);max-width:78ch;font-size:14.5px}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 20px}
  .chip{padding:6px 14px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px;white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
  h2.sec{font-size:17px;margin:30px 0 14px;letter-spacing:-.2px}
  .grid{display:grid;gap:20px 16px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
  .card{text-align:left;display:block;border-radius:var(--radius);overflow:hidden}
  .thumbwrap{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;
    aspect-ratio:16/9;border:1px solid var(--line)}
  .thumbwrap.portrait{aspect-ratio:9/16;max-height:420px}
  .thumbwrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s ease}
  .card:hover .thumbwrap img,.card:focus-visible .thumbwrap img{transform:scale(1.045)}
  .card:focus-visible .thumbwrap{outline:2px solid var(--accent);outline-offset:2px}
  .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.84);
    padding:2px 7px;border-radius:5px;font:600 12px/1.5 var(--mono)}
  .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.8);color:var(--good);
    padding:2px 8px;border-radius:5px;font:600 11px/1.6 var(--mono)}
  /* Top-right so it never collides with .badge (SHORT), .dur or .resume, and
     absolutely positioned so a snapshot that arrives after first paint can be
     patched in without moving anything already on screen. */
  .score{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.8);color:var(--accent);
    padding:2px 8px;border-radius:5px;font:600 11px/1.6 var(--mono)}
  .resume{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
  .resume i{display:block;height:100%;background:var(--bad)}
  .meta{padding:11px 3px 0}
  .meta h3{margin:0 0 5px;font-size:14.5px;line-height:1.35;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .sub{color:var(--dim);font-size:12.5px}
  .empty{color:var(--dim);padding:40px 0;text-align:center}

  /* ---------- watch ---------- */
  .watch{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:26px;align-items:start}
  .player{position:relative;background:#000;border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--line)}
  .player.portrait{max-width:420px;margin:0 auto}
  video{width:100%;display:block;background:#000;aspect-ratio:16/9}
  video.portrait{aspect-ratio:9/16}
  .vtitle{font-size:clamp(17px,2.3vw,21px);margin:16px 0 10px;line-height:1.3;letter-spacing:-.2px}
  .vrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--line)}
  .chan{display:flex;align-items:center;gap:10px;margin-right:auto}
  .chan{min-width:0}
  .chan>span{min-width:0;overflow-wrap:anywhere}
  .grid>div{min-width:0;overflow-wrap:anywhere}
  .chan .av{width:38px;height:38px;border-radius:50%;background:var(--surface2);
    display:grid;place-items:center;font-size:18px;border:1px solid var(--line)}
  .chan b{display:block;font-size:14px}
  .chan span{color:var(--dim);font-size:12.5px}
  .desc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 17px;margin-top:16px;white-space:pre-wrap;font-size:14px;color:#cfd9e8}
  .desc .stat{color:var(--dim);font-size:12.5px;margin-bottom:10px;font-family:var(--mono)}
  .chapters{margin-top:18px}
  .chapters ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .chapters li button{width:100%;display:flex;gap:13px;align-items:baseline;
    padding:9px 12px;border-radius:9px;text-align:left;font-size:13.7px;color:var(--dim)}
  .chapters li button:hover{background:var(--surface)}
  .chapters li button.on{background:var(--surface2);color:var(--ink)}
  .chapters time{font:600 12.5px/1.5 var(--mono);color:var(--accent);flex-shrink:0}

  /* ---------- community (optional metrics snapshot) ---------- */
  .comm{margin-top:18px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 17px}
  .comm h2{font-size:14px;margin:0 0 13px;color:var(--dim);
    text-transform:uppercase;letter-spacing:.08em}
  .comm .nums{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}
  .comm .nums span{background:var(--surface2);border:1px solid var(--line);
    border-radius:999px;padding:5px 13px;font-size:13px;color:var(--dim)}
  .comm .sig{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
  .comm .sig span{background:var(--surface2);border:1px solid var(--line);
    border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--dim)}
  /* Published, not hidden — just not dressed as an endorsement. */
  .comm .sig span.neg b{color:var(--bad)}
  .comm b{font-family:var(--mono);color:var(--ink)}
  .comm .src{color:var(--dim);font-size:12px;margin-top:11px}
  /* A machine review must not read as a human one. Dashed rather than solid,
     no surface fill, a mono tag chip and its reviewer id on the same line —
     different at a glance from every other card in the file. */
  .mrev{margin-top:15px;border:1px dashed var(--line);border-left:3px dashed var(--dim);
    border-radius:0 var(--radius) var(--radius) 0;padding:13px 16px}
  .mrev .tag{font:700 10.5px/1.6 var(--mono);letter-spacing:.08em;
    background:var(--dim);color:var(--bg);padding:2px 8px;border-radius:4px}
  .mrev .who{font:600 12px/1.6 var(--mono);color:var(--dim);margin-left:9px}
  .mrev h4{margin:11px 0 6px;font-size:14px;font-weight:600}
  .mrev p{margin:0;font-size:13.5px;color:#cfd9e8;white-space:pre-wrap}
  .mrev .disc{color:var(--dim);font-size:12px;margin-top:9px}

  aside h3{font-size:14px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .up{display:flex;gap:11px;margin-bottom:13px;text-align:left;width:100%;border-radius:9px}
  .up:hover{background:var(--surface)}
  .up .t{width:150px;flex-shrink:0;position:relative;border-radius:8px;overflow:hidden;
    aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
  .up .t img{width:100%;height:100%;object-fit:cover}
  .up .i h4{margin:0 0 4px;font-size:13.4px;line-height:1.35;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .up .i span{color:var(--dim);font-size:12px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{padding:7px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px}
  .tbtn:hover{border-color:var(--accent)}
  .tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .mode-switch{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .mode-switch:focus-visible,.tbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #mode-tools{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- misc ---------- */
  .note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0;padding:16px 19px;margin:26px 0;font-size:14px;color:#cfd9e8}
  .note b{color:var(--ink)}
  code{font-family:var(--mono);font-size:.92em;background:var(--surface2);
    padding:1px 6px;border-radius:5px}
  footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 18px 40px;
    color:var(--dim);font-size:13px;max-width:1440px;margin-left:auto;margin-right:auto}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;
    font-size:13.5px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
  .toast.show{opacity:1}

  .stage{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);aspect-ratio:16/10}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .stage .card3{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
    padding:6%;background:#080c13;gap:10px}
  .stage .card3 h2{font-size:clamp(20px,3.6vw,40px);margin:0;letter-spacing:-.5px}
  .stage .card3 p{margin:0;color:var(--accent);font-size:clamp(14px,1.9vw,21px)}
  .stage .card3 small{color:var(--dim);font-size:13px;max-width:60ch;margin:8px auto 0;line-height:1.5}
  .stage .l3{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;
    background:linear-gradient(transparent,rgba(4,7,12,.93) 32%);pointer-events:none}
  .stage .l3 b{display:block;font-size:clamp(15px,2vw,23px)}
  /* ---- shred: record your own run of a live scene ---- */
  .stage .shred-pip{position:absolute;right:12px;bottom:12px;width:22%;max-width:220px;aspect-ratio:4/3;
    object-fit:cover;border-radius:calc(var(--radius) - 4px);border:2px solid var(--accent);z-index:5;
    background:#000;transform:scaleX(-1)}
  .shredp{margin-top:10px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);font-size:14px;line-height:1.55}
  .shredp h3{margin:0 0 6px;font-size:15px}
  .shredp label{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer;color:var(--fg)}
  .shredp .fine{color:var(--dim);font-size:12.5px;margin:8px 0 10px}
  .shredp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .shredp .rec{color:var(--bad);font-weight:600}
  .shredp time{font-variant-numeric:tabular-nums;color:var(--accent)}
  .stage .l3 .bn{color:var(--accent);font-size:12.5px}
  .stage .l3 .bg{color:var(--bad);font-size:13.5px;margin-top:5px}
  .stage .l3 .fx{color:var(--good);font-size:12.5px;font-family:var(--mono);margin-top:2px}
  .stage .shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .28s;pointer-events:none}
  .lbar{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);
    border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius)}
  .lbar .scrub{flex:1;height:6px;border-radius:3px;background:var(--surface2);position:relative;cursor:pointer}
  .lbar .scrub i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;display:block}
  .lbar time{font:600 12.5px/1 var(--mono);color:var(--dim)}
  .livetag{background:var(--good);color:#04140c;font:700 10.5px/1 var(--mono);
    padding:4px 7px;border-radius:4px;letter-spacing:.06em}
  @media (max-width:980px){
    .watch{grid-template-columns:1fr}
    aside{margin-top:10px}
  }
  @media (max-width:620px){
    .bar{flex-wrap:wrap;padding:10px 14px}
    .search{order:3;width:100%;max-width:none;flex-basis:100%}
    main{padding:16px 14px 80px}
    .grid{grid-template-columns:1fr;gap:22px}
    .up .t{width:120px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="#/" aria-label="RAPP Vision home">
      <span class="logo">▶</span><span>RAPP&nbsp;Vision</span>
    </a>
    <div class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Search videos, tags, chapters…" aria-label="Search">
    </div>
    <button class="navbtn" id="nav-ch">RAPP Hive</button>
    <button class="navbtn" id="nav-lib">Library</button>
    <button class="navbtn" id="nav-about">About</button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <strong>RAPP Vision</strong> — local-first video. One HTML file, no server, no account, no tracking.
  Your watch history, resume points and playlists live in <code>localStorage</code> and never leave the browser.
  Video is streamed straight from public GitHub repos.
  <span id="foot-src"></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * RAPP Vision — a local-first video platform.
 *
 * No backend. The catalog is a JSON file; the media are ordinary files
 * in a public repo. A new publication pairs MP4 + WebM orientation with
 * a live replay under one entry. Everything personal (history, resume position,
 * watch-later, likes) stays in localStorage and is exportable as JSON.
 * ------------------------------------------------------------------ */

const LS = "rapp_vision_v1";
const $  = (s, r = document) => r.querySelector(s);
const app = $("#app");

/* Every channel is just a channel.json in some public repo. Sources and
   thumbnails inside it resolve relative to THAT file's URL, which is what
   lets a channel live anywhere and still play here. */
let CHANNELS = [];        // loaded channel objects, each with .videos
let ALL_VIDEOS = [];      // full catalog; direct links must ignore subscriptions
let VIDEOS  = [];         // flattened, each video carries ._ch
let state = load();
let LEGACY_POLICY = { channels: [] };

/* publication contract:start
   This block is deliberately dependency-free: tests execute the exact browser
   validator under Node so the CLI and player cannot silently grow different
   definitions of a valid paired publication. */
const CURRENT_CHANNEL_SCHEMA = "rapp-vision-channel/2.0";
const LEGACY_CHANNEL_SCHEMA = "rapp-vision-channel/1.0";
const LIVE_REPLAY_KIND = "rapp-vision-live/1.0";
const MAX_PUBLICATION_DURATION = 86400;
const rvObject = v => !!v && typeof v === "object" && !Array.isArray(v);
const rvString = v => typeof v === "string" && !!v.trim();
const rvNumber = v => typeof v === "number" && Number.isFinite(v);
const rvPoint = v => Array.isArray(v) && v.length === 2 && v.every(rvNumber);
const rvTarget = v => rvObject(v) && (rvString(v.selector) !== rvString(v.text));
const replayDuration = live => rvNumber(live && live.duration) &&
  live.duration > 0 && live.duration <= MAX_PUBLICATION_DURATION
  ? live.duration
  : ((live && live.scenes) || []).reduce((m, s) =>
      Math.max(m, rvObject(s) && rvNumber(s.t) && rvNumber(s.dur) ? s.t + s.dur : 0), 0);

function validateModeChapters(chapters, duration, path) {
  const out = [];
  if (chapters === undefined) return out;
  if (!Array.isArray(chapters)) return [`${path}: must be an array`];
  let previous = -1;
  chapters.forEach((chapter, i) => {
    const cp = `${path}[${i}]`;
    if (!rvObject(chapter)) { out.push(`${cp}: must be an object`); return; }
    if (!rvNumber(chapter.t) || chapter.t < 0 || chapter.t >= duration)
      out.push(`${cp}.t: must be within the mode duration`);
    else if (chapter.t <= previous) out.push(`${cp}.t: chapters must be strictly increasing`);
    else previous = chapter.t;
    if (!rvString(chapter.label)) out.push(`${cp}.label: must be a non-empty string`);
  });
  return out;
}

function validateReplayAction(a, dur, path) {
  const out = [];
  if (!rvObject(a)) return [`${path}: must be an object`];
  if (!rvNumber(a.at) || a.at < 0 || a.at > dur)
    out.push(`${path}.at: must be between 0 and the scene duration`);
  const kinds = new Set(["click", "key", "keydown", "keyup", "type", "drag", "scroll"]);
  if (!kinds.has(a.do)) return out.concat(`${path}.do: unsupported action ${JSON.stringify(a.do)}`);
  const selector = rvString(a.selector), text = rvString(a.text);
  if (a.do === "click" && selector === text)
    out.push(`${path}: click requires exactly one non-empty selector or text`);
  else if (["key", "keydown", "keyup"].includes(a.do) && !rvString(a.code))
    out.push(`${path}.code: ${a.do} requires a non-empty code`);
  else if (a.do === "type" && typeof a.text !== "string")
    out.push(`${path}.text: type requires a string`);
  else if (a.do === "drag" && (!rvPoint(a.from) || !rvPoint(a.to)))
    out.push(`${path}: drag requires numeric two-item from and to points`);
  else if (a.do === "scroll" && (+selector + +text + +rvPoint(a.to) !== 1))
    out.push(`${path}: scroll requires exactly one selector, text, or numeric to point`);
  return out;
}

function validateLiveReplay(live, path) {
  const out = [];
  if (!rvObject(live)) return [`${path}: must be an object`];
  if (live.kind !== LIVE_REPLAY_KIND) out.push(`${path}.kind: must equal "${LIVE_REPLAY_KIND}"`);
  if (!Array.isArray(live.scenes) || !live.scenes.length)
    return out.concat(`${path}.scenes: must be a non-empty array`);
  let cursor = 0;
  live.scenes.forEach((scene, i) => {
    const sp = `${path}.scenes[${i}]`;
    if (!rvObject(scene)) { out.push(`${sp}: must be an object`); return; }
    if (!rvNumber(scene.t) || scene.t < 0) out.push(`${sp}.t: must be a non-negative number`);
    else if (Math.abs(scene.t - cursor) > 1e-6)
      out.push(`${sp}.t: scenes must be contiguous; expected ${cursor}`);
    if (!rvNumber(scene.dur) || scene.dur <= 0) { out.push(`${sp}.dur: must be greater than zero`); return; }
    const card = rvObject(scene.card), appScene = rvString(scene.app);
    if (card === appScene) out.push(`${sp}: must contain exactly one card object or non-empty app`);
    if ("ready" in scene) {
      if (!appScene) out.push(`${sp}.ready: is valid only on app scenes`);
      if (!rvTarget(scene.ready)) out.push(`${sp}.ready: requires exactly one non-empty selector or text`);
      else if ("enabled" in scene.ready && typeof scene.ready.enabled !== "boolean")
        out.push(`${sp}.ready.enabled: must be boolean`);
    }
    const actions = scene.actions || [];
    if (!Array.isArray(actions)) out.push(`${sp}.actions: must be an array`);
    else {
      if (actions.length && !appScene) out.push(`${sp}.actions: card scenes cannot contain actions`);
      actions.forEach((a, ai) => out.push(...validateReplayAction(a, scene.dur, `${sp}.actions[${ai}]`)));
    }
    if (rvNumber(scene.t)) cursor = scene.t + scene.dur;
  });
  const explicit = live.duration;
  if (explicit !== undefined && (!rvNumber(explicit) || explicit <= 0 || explicit > MAX_PUBLICATION_DURATION))
    out.push(`${path}.duration: must be greater than zero and at most ${MAX_PUBLICATION_DURATION}`);
  const duration = explicit !== undefined && rvNumber(explicit) && explicit > 0 ? explicit : cursor;
  if (duration <= 0 || duration > MAX_PUBLICATION_DURATION)
    out.push(`${path}.scenes: derived replay duration must be greater than zero and at most ${MAX_PUBLICATION_DURATION}`);
  else if (Math.abs(cursor - duration) > 1e-6)
    out.push(`${path}.scenes: must fill replay duration ${duration}; ended at ${cursor}`);
  out.push(...validateModeChapters(live.chapters, duration, `${path}.chapters`));
  return out;
}

function validatePairedPublication(v, path) {
  const out = [];
  if (!rvObject(v)) return [`${path}: must be an object`];
  ["id", "title"].forEach(k => { if (!rvString(v[k])) out.push(`${path}.${k}: must be a non-empty string`); });
  const duration = rvNumber(v.duration) && v.duration > 0 && v.duration <= MAX_PUBLICATION_DURATION
    ? v.duration : 0;
  if (!duration) out.push(`${path}.duration: must be greater than zero and at most ${MAX_PUBLICATION_DURATION}`);
  else out.push(...validateModeChapters(v.chapters, duration, `${path}.chapters`));
  const types = new Set();
  if (!Array.isArray(v.sources) || !v.sources.length) out.push(`${path}.sources: must be a non-empty array`);
  else v.sources.forEach((s, i) => {
    const sp = `${path}.sources[${i}]`;
    if (!rvObject(s)) { out.push(`${sp}: must be an object`); return; }
    if (!rvString(s.src)) out.push(`${sp}.src: must be a non-empty string`);
    if (!rvString(s.type)) out.push(`${sp}.type: must be a non-empty media type`);
    else {
      const type = s.type.split(";", 1)[0].trim().toLowerCase();
      if (!["video/mp4", "video/webm"].includes(type))
        out.push(`${sp}.type: only video/mp4 and video/webm are allowed`);
      else types.add(type);
    }
  });
  ["video/mp4", "video/webm"].forEach(type => {
    if (!types.has(type)) out.push(`${path}.sources: missing required ${type} source`);
  });
  out.push(...validateLiveReplay(v.live, `${path}.live`));
  return out;
}

function legacyPublicationRecord(policy, channelId, sourceUrl) {
  return (policy.channels || []).find(r => rvObject(r) && r.id === channelId && r.source === sourceUrl) || null;
}

function validateChannelContract(channel, sourceUrl, policy = LEGACY_POLICY) {
  const out = [];
  if (!rvObject(channel)) return ["channel: must be an object"];
  if (!rvString(channel.id)) out.push("channel.id: must be a non-empty string");
  if (!rvString(channel.name)) out.push("channel.name: must be a non-empty string");
  const videos = Array.isArray(channel.videos) ? channel.videos : [];
  if (!videos.length) out.push("channel.videos: must be a non-empty array");
  const ids = videos.filter(rvObject).map(v => v.id);
  if (new Set(ids).size !== ids.length) out.push("channel.videos: publication ids must be unique");
  if (channel.schema === CURRENT_CHANNEL_SCHEMA)
    videos.forEach((v, i) => out.push(...validatePairedPublication(v, `channel.videos[${i}]`)));
  else if (channel.schema === LEGACY_CHANNEL_SCHEMA) {
    const legacy = legacyPublicationRecord(policy, channel.id, sourceUrl);
    if (!legacy) out.push("channel.schema: v1 is frozen legacy only; channel id and canonical source are not allowlisted");
    else {
      const allowed = new Set(legacy.publications || []);
      videos.forEach((v, i) => {
        if (!rvObject(v) || !allowed.has(v.id))
          out.push(`channel.videos[${i}].id: ${JSON.stringify(v && v.id)} is not a frozen legacy publication`);
      });
    }
  } else out.push(`channel.schema: must equal "${CURRENT_CHANNEL_SCHEMA}"`);
  return out;
}
/* publication contract:end */

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS) || "{}");
    return { history: s.history || {}, later: s.later || [], liked: s.liked || [],
             rate: s.rate || 1, subs: s.subs || null, custom: s.custom || [],
             follows: s.follows || [], followSeen: s.followSeen || [], followCache: s.followCache || {} };
  } catch { return { history: {}, later: [], liked: [], rate: 1, subs: null, custom: [],
                     follows: [], followSeen: [], followCache: {} }; }
}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} }

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1900);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* A channel's avatar may be a glyph ("\ud83e\udea8") or an image URL. Render the
     right thing for each — dumping a URL as text is how it used to spill across
     the page. Anything that isn't a URL is treated as a glyph. */
  const isUrl = (v) => /^(https?:\/\/|\.{0,2}\/)/.test(String(v || "").trim());
  const avatarHTML = (av, px) => {
    const size = px || 38;
    const box = `width:${size}px;height:${size}px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);flex:0 0 auto;overflow:hidden`;
    if (isUrl(av)) {
      return `<span style="${box};display:block"><img src="${esc(av)}" alt="" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block"></span>`;
    }
    return `<span style="${box};display:grid;place-items:center;font-size:${Math.round(size * 0.5)}px">${esc(av || "\ud83d\udcfa")}</span>`;
  };

function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
           : `${m}:${String(s).padStart(2, "0")}`;
}
function ago(d) {
  const days = Math.floor((Date.now() - new Date(d + "T12:00:00").getTime()) / 864e5);
  if (isNaN(days)) return "";
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  const mo = Math.floor(days / 30);
  return mo < 12 ? mo + (mo === 1 ? " month ago" : " months ago")
                 : Math.floor(mo / 12) + " year" + (mo >= 24 ? "s" : "") + " ago";
}
const byId = id => VIDEOS.find(v => v.id === id)
  || ALL_VIDEOS.find(v => v.id === id);
const isPaired = v => !!(v && v.live && Array.isArray(v.sources) && v.sources.length);
const historyKey = (v, mode) => isPaired(v) ? `${v.id}::${mode}` : v.id;
const historyVideo = key => byId(String(key).replace(/::(?:video|live)$/, ""));
const prog = v => {
  const h = state.history[historyKey(v, "video")];
  return h && h.d ? Math.min(1, h.t / h.d) : 0;
};

/* ---------------- community snapshot (optional) ----------------
 *
 * state/metrics.json is a read-only aggregate committed to THIS repo:
 * endorsements, signal channels, conversation counts, thread URLs and any
 * editorial review, keyed per video. It is entirely optional. Missing,
 * 404, malformed JSON or a shape nobody recognises all land in the same
 * place — METRICS stays null and every render site below returns "", so
 * the player is byte-for-byte the player it was before the file existed.
 *
 * It is deliberately NOT part of state: save() re-serialises the whole of
 * `state` on every timeupdate tick and Export spreads it into the user's
 * library file, so a snapshot parked there would be both constant write
 * traffic and fake "personal data" in an export.
 *
 * It also never gates first paint — see loadMetrics().
 */
let METRICS = null;                 // Map(normalised key -> parsed record)

/* votes.json-style key skew is a solved problem upstream: one normaliser,
   called by the shipped code, never re-derived at the call site. */
const normKey = s => String(s ?? "").trim().toLowerCase().replace(/[-\s]+/g, "_");

/* A video id is only unique inside its own channel.json — template/channel.json
   ships "my-first-video" and every new publisher copies it — so the subject id
   is scoped by the channel id declared INSIDE that file. */
const vkey = v => (v && v._ch ? v._ch.id : "") + "/" + (v ? v.id : "");

const numOr = x => (typeof x === "number" && isFinite(x) && x >= 0) ? x : null;
const strOr = x => (typeof x === "string" ? x.trim() : "");

/* The snapshot is untrusted input — anyone can open a PR against it. esc()
   keeps a value inside its attribute; this keeps `javascript:` out of an href. */
function httpUrl(u) {
  if (!u) return "";
  try { const p = new URL(String(u), location.href); return /^https?:$/.test(p.protocol) ? p.href : ""; }
  catch { return ""; }
}

/* The experience channels this network actually publishes — `SIGNAL_MAP` in
   scripts/rapp_metrics.py, mirrored into the snapshot's own `signal_channels`
   block. The collector is the authority for that vocabulary; anything else a
   snapshot carries is labelled from its own key rather than dropped, so a
   publisher can add a channel without shipping a new player. */
const SIGNAL_LABELS = {
  watched_it_all: "watched it all", learned_something: "learned something",
  want_more_like_this: "want more like this", tried_it_myself: "tried it myself",
  saved_for_later: "saved for later", too_long: "too long",
  confusing: "found it confusing"
};

/* Named negatives, read from the snapshot's own `counting.negative_signals`
   rather than hardcoded here — a second list of what counts as negative is a
   second source of truth, and the two would drift. They are published under
   their own names and subtract from nothing, so they are shown, not hidden;
   they are just not shown as though they were endorsements. */
let NEG_SIGNALS = new Set();

/* An agent review is editorial: engine-written, printed beside the human
   numbers and never folded into them. It is only worth rendering if it says
   something and can be attributed to the thing that wrote it.
 *
 * Two shapes are accepted. The rubric record this repo's collector writes
 * (`editorial_review()` in scripts/rapp_metrics.py) is a verdict plus a
 * checks tally plus a `notes` array of what a reader would trip over; a
 * different reviewer may instead publish a freeform headline and body. */
function parseReview(r) {
  if (!r || typeof r !== "object" || Array.isArray(r)) return null;
  const verdict = strOr(r.verdict);
  const passed = numOr(r.checks_passed), total = numOr(r.checks_total), na = numOr(r.not_applicable);
  const notes = Array.isArray(r.notes) ? r.notes.map(strOr).filter(Boolean) : [];
  /* A one-word verdict ("ready" / "rough") is a headline, not prose. Printed as
     a body it says nothing; the checks it was computed from are the content. */
  const rubric = !!verdict && total !== null;
  const headline = strOr(r.headline ?? r.title) ||
    (rubric ? `${verdict} — ${passed === null ? "?" : passed} of ${total} checks pass` +
              (na ? `, ${na} not applicable` : "")
            : verdict);
  const body = strOr(r.review ?? r.body ?? r.text) ||
    (notes.length ? notes.map(n => "• " + n).join("\n")
                  : (rubric ? "Nothing in the record to flag." : ""));
  if (!body && !headline) return null;
  return {
    who: strOr(r.model ?? r.reviewer_id ?? r.reviewer ?? r.critic_id ?? r.critic ?? r.by) || "unattributed",
    score: numOr(r.score), url: httpUrl(r.url),
    /* The fingerprint of the record the verdict was computed from. Without it a
       stale review is indistinguishable from a current one. */
    on: strOr(r.record_sha8 ?? r.sha8), headline, body
  };
}

function parseRecord(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const sigs = raw.signals && typeof raw.signals === "object" ? raw.signals : {};
  return {
    /* null, not 0, when the snapshot does not carry the field — see figure(). */
    up: numOr(raw.up ?? raw.upvotes ?? raw.endorsements),
    watched: numOr(raw.watched),
    comments: numOr(raw.comments ?? raw.conversation),
    /* `score` is whatever ranking the writer chose to publish — this network's
       collector publishes `2 * upvotes + watched` — so it is taken as given and
       never recomputed here. When the snapshot omits it the endorsement count
       stands in rather than a number being invented; when it carries neither,
       there is no figure and no pill. */
    score: numOr(raw.score) ?? numOr(raw.up ?? raw.upvotes ?? raw.endorsements),
    /* Only channels that actually registered are rendered. A row of zeros is
       noise, and a zero is indistinguishable from a channel nobody wired up. */
    signals: Object.keys(sigs).map(k => [k, numOr(sigs[k])])
      .filter(([, n]) => n !== null && n > 0)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])),
    url: httpUrl(raw.url ?? raw.thread ?? raw.discussion),
    review: parseReview(raw.review ?? raw.editorial ?? raw.machine_review)
  };
}

const EMPTY_RECORD = () =>
  ({ up: null, watched: null, comments: null, score: null, signals: [], url: "", review: null });

function indexMetrics(doc) {
  if (!doc || typeof doc !== "object") return null;
  const map = doc.videos || doc.agents || doc.entries || doc.items ||
              (doc.schema ? null : doc);          // a bare map is accepted too
  if (!map || typeof map !== "object") return null;

  /* The snapshot names its own negatives; the player does not get a vote. */
  const neg = (doc.counting || {}).negative_signals;
  NEG_SIGNALS = new Set(Array.isArray(neg)
    ? neg.filter(x => typeof x === "string").map(normKey) : []);

  /* A key is stored exactly as the snapshot published it (normalised, nothing
     more). A scoped key never also registers its bare tail: `<channel>/<video>`
     answers for that channel's video and for nothing else. Deriving a bare alias
     from a scoped key would let one channel's record answer for a different
     channel's identically-named video — and bare ids collide by construction,
     since `template/channel.json` ships "my-first-video" and the README tells
     every new publisher to copy it. That is why the subject id is scoped in the
     first place; the lookup must not undo it. */
  const out = new Map();

  Object.keys(map).forEach(k => {
    const rec = parseRecord(map[k]);
    if (!rec) return;                              // one bad record, not one bad file
    out.set(normKey(k), rec);
  });

  /* Agent reviews live in their own top-level block precisely so they are never
     summed into a human count. An entry may have a review and no reactions at
     all, so a review can bring a record into being — with every human figure
     still unknown rather than zero.
     `editorial` is checked first because that is the key this repo's collector
     actually writes (`snapshot_body()` in scripts/rapp_metrics.py). Reading only
     the other two spellings was a silent join failure of the worst kind: every
     review would have been invisible, and "the rubric wrote nothing yet" and
     "the player cannot see what the rubric wrote" render identically. */
  const revs = doc.editorial || doc.agent_reviews || doc.reviews;
  if (revs && typeof revs === "object") Object.keys(revs).forEach(k => {
    const review = parseReview(revs[k]);          // skips the block's own `note`
    if (!review) return;
    let rec = out.get(normKey(k));
    if (!rec) { rec = EMPTY_RECORD(); out.set(normKey(k), rec); }
    if (!rec.review) rec.review = review;
  });

  return out.size ? out : null;
}

/* The scoped key first, then the bare video id — which can only match a key the
   snapshot itself published unscoped, since nothing registers a bare alias on a
   scoped key's behalf. So a publisher who writes plain "my-video" is still read,
   and a record filed under another channel can never answer here. */
function mfind(key) {
  if (!METRICS) return null;
  const k = String(key || "");
  return METRICS.get(normKey(k)) || METRICS.get(normKey(k.slice(k.lastIndexOf("/") + 1))) || null;
}
const mget = v => mfind(vkey(v));

/* The compact figure on a card is the snapshot's published `score` — a ranking
   convention, not a measurement, and not the endorsement count: calling it
   "endorsements" in the tooltip would assert that N people endorsed this when
   the figure this network publishes also folds in the watch tally. So the
   components go in the tooltip and the number is named for what it is.
   It appears only when there is one to show: a video with no record, or a
   record with no figure, or a figure of 0, gets no badge at all rather than a
   "—" on every tile — "never counted" and "counted, and it is zero" are
   different claims. */
function scorePillHTML(m) {
  if (!m || m.score === null || m.score <= 0) return "";
  const parts = [];
  if (m.up !== null) parts.push(`${m.up} ${plural(m.up, "endorsement", "endorsements")}`);
  if (m.watched !== null) parts.push(`${m.watched} marked watched`);
  const title = `Community score ${m.score}` + (parts.length ? ` · ${parts.join(", ")}` : "");
  return `<span class="score" title="${esc(title)}">★ ${esc(m.score)}</span>`;
}

function reviewHTML(r) {
  if (!r) return "";
  return `<div class="mrev">
    <span class="tag">MACHINE REVIEW</span><span class="who">reviewer: ${esc(r.who)}${r.score === null ? "" : ` · score ${esc(r.score)}`}</span>
    ${r.headline ? `<h4>${esc(r.headline)}</h4>` : ""}
    ${r.body ? `<p>${esc(r.body)}</p>` : ""}
    <div class="disc">Written by an engine, not by a person. It is a second opinion printed
      beside the human numbers and is counted in none of them.${r.on
        ? ` Computed from record <code>${esc(r.on)}</code>.` : ""}${r.url
        ? ` <a href="${esc(r.url)}" target="_blank" rel="noopener">Transcript ↗</a>` : ""}</div>
  </div>`;
}

/* A number the snapshot does not carry is unknown, and unknown renders as an
   em-dash. "No thread seeded yet" and "nobody reacted" are different claims,
   and printing 0 for the first asserts the second. A measured zero still
   prints as 0. */
const figure = n => (n === null ? "—" : esc(n));
const plural = (n, one, many) => (n === 1 ? one : many);

/* No thread and no signal renders nothing at all — not a heading, not a row of
   zeros. A thread that exists but has not been reacted to yet renders as the
   link alone, which is the one thing about it that is true. */
function communityHTML(m) {
  if (!m) return "";
  const known = [m.up, m.watched, m.comments].some(n => n !== null);
  if (!(m.url || known || m.signals.length || m.review)) return "";

  const nums = [];
  if (m.up !== null) nums.push(`<span><b>${figure(m.up)}</b> ${plural(m.up, "endorsement", "endorsements")}</span>`);
  /* "watched" is people who signed in and tapped a reaction. It is a floor and
     a fraction, so it is labelled as what it is and never as "views". */
  if (m.watched !== null) nums.push(`<span><b>${figure(m.watched)}</b> marked watched</span>`);
  if (m.comments !== null) nums.push(`<span><b>${figure(m.comments)}</b> in the conversation</span>`);

  return `<section class="comm">
    <h2>Community</h2>
    ${nums.length ? `<div class="nums">${nums.join("")}</div>` : ""}
    ${m.signals.length ? `<div class="sig">${m.signals.map(([k, n]) => {
      /* A named negative is published, never hidden and never netted off a
         positive — but it must not read as one either, sitting in an identical
         chip in a list sorted by count. */
      const bad = NEG_SIGNALS.has(normKey(k));
      return `<span${bad ? ` class="neg" title="A named negative. It is published under its own name, subtracts from nothing and is in no score."` : ""}><b>${esc(n)}</b> ${esc(SIGNAL_LABELS[k] || k.replace(/_/g, " "))}</span>`;
    }).join("")}</div>` : ""}
    ${m.url ? `<div class="toolbar"><a class="tbtn" href="${esc(m.url)}" target="_blank" rel="noopener">Discuss on GitHub →</a></div>` : ""}
    <div class="src">Counts are read from a static snapshot committed next to this player, and
      they count people signed in to GitHub — a minority of any audience. Reading the file
      sends nothing about you, and nothing you do here is written back.</div>
    ${reviewHTML(m.review)}
  </section>`;
}

/* ---------------------------- views ---------------------------- */

function cardHTML(v) {
  const p = prog(v), portrait = v.orientation === "portrait";
  return `<a class="card" href="#/watch/${encodeURIComponent(v.id)}" data-vk="${esc(vkey(v))}">
    <div class="thumbwrap${portrait ? " portrait" : ""}">
      <img src="${esc(v.thumb)}" alt="" loading="lazy" decoding="async">
      ${portrait ? '<span class="badge">SHORT</span>' : ""}

function matches(v, q) {
  if (!q) return true;

               ((v.live && v.live.chapters) || []).map(c => c.label).join(" ")].join(" ").toLowerCase();

}

function viewHome(q = "", tag = "") {

  app.innerHTML = `
    ${q || tag ? "" : `<section class="hero">
      <h1>${esc(CHANNELS[0] ? (CHANNELS[0].tagline || CHANNELS[0].about || "Local-first video.") : "Local-first video.")}</h1>
      <p>Local-first video. This whole site is one HTML file with no backend and no account —
         the catalog is a JSON file and the media are ordinary files in a public GitHub repo.
         Your history, resume points and playlists stay in this browser.</p>
    </section>`}
    ${tags.length ? `<div class="chips" role="group" aria-label="Filter by tag">
      <button class="chip${tag ? "" : " on"}" data-tag="">All</button>
      ${tags.map(t => `<button class="chip${t === tag ? " on" : ""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
    </div>` : ""}
    ${cont.length && !q && !tag ? `<h2 class="sec">Continue watching</h2>
      <div class="grid">${cont.map(cardHTML).join("")}</div>` : ""}
    <h2 class="sec">${q ? `Results for “${esc(q)}”` : tag ? `#${esc(tag)}` : "All videos"} · ${list.length}</h2>
    ${list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
                  : `<p class="empty">Nothing matches that. Try clearing the search.</p>`}`;

  app.querySelectorAll(".chip").forEach(b =>
    b.onclick = () => viewHome($("#q").value.trim(), b.dataset.tag));
}

/* ---------------------------------------------------------------- *
 * Live replay — a video that is a script, not a file.
 *
 * Each scene loads the REAL application in an iframe and replays the
 * recorded interactions against a clock. Every GitHub Pages repo is
 * served from one origin, so the player can dispatch real events into
 * the frame. Play/pause/seek behave normally, but the app is genuinely
 * running — pause and you can take over.
 *
 * Cross-origin (or a browser that blocks it) degrades to captions;
 * channels publish a static cut alongside anyway.
 * ---------------------------------------------------------------- */
/* ---------- shred: capture your own run of a live scene ----------

   A shred is a performance, not a copy: the viewer runs the scene (and can
   seize the controls), and what happened on THEIR screen becomes THEIR video.
   Everything below is deliberate policy, not convenience:

   - Camera and mic are OFF unless switched on for this one recording. The
     network is mirrored and content-addressed; a face published to it is
     effectively permanent, so nothing defaults toward the camera.
   - Export is the default; publishing is a separate, deliberate act. The
     Share button hands the file to the device's own share sheet (iMessage,
     AirDrop, …) — nothing is uploaded anywhere by this page, ever.
   - Capture is the TAB, via getDisplayMedia. The camera preview is an
     on-page overlay, so the browser composites it into the recording for
     free — no canvas pipeline, and what you see is exactly what you get.  */
const Shred = (() => {
  let rec = null, chunks = [], streams = [], ctx = null, timerId = 0, capId = 0;
  const CAP_MS = 10 * 60 * 1000;                 // hard stop; a shred is a run, not a broadcast

  const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";

  function panel(v) {
    let el = $("#shredp");
    if (!el) {
      el = document.createElement("div");
      el.className = "shredp"; el.id = "shredp";
      $("#host").after(el);
    }
    return el;
  }

  function cleanup() {
    clearInterval(timerId); clearTimeout(capId); timerId = capId = 0;
    streams.forEach(s => s.getTracks().forEach(t => t.stop())); streams = [];
    if (ctx) { ctx.close().catch(() => {}); ctx = null; }
    document.querySelector(".shred-pip")?.remove();
    rec = null;
  }

  function open(v) {
    if (rec) return;                              // already recording
    if (!mime || !navigator.mediaDevices?.getDisplayMedia) {
      toast("This browser can’t record the tab"); return;
    }
    panel(v).innerHTML = `
      <h3>⏺ Shred this scene</h3>
      <div class="fine">Recording happens on this device and stays on it. When you stop,
        you get the file — share it or keep it. Nothing is uploaded by this page.
        Publishing to a channel is a separate, deliberate step, and published videos are
        mirrored in ways that are effectively permanent — so the camera stays off unless
        you turn it on, each time.</div>
      <label><input type="checkbox" id="sh-mic"> My microphone (narrate over it)</label>
      <label><input type="checkbox" id="sh-cam"> My camera, as a small overlay (off by default on purpose)</label>
      <div class="fine">The browser will ask which surface to record — pick <b>this tab</b>.
        Playback starts when recording does.</div>
      <div class="row">
        <button class="tbtn" id="sh-go">Start recording</button>
        <button class="tbtn" id="sh-no">Cancel</button>
      </div>`;
    $("#sh-no").onclick = () => { panel(v).remove(); };
    $("#sh-go").onclick = () => start(v).catch(e => {
      cleanup(); panel(v).remove();
      toast(String(e && e.name === "NotAllowedError" ? "Recording permission declined" : "Couldn’t start: " + (e.message || e)));
    });
  }

  async function start(v) {
    const wantMic = $("#sh-mic").checked, wantCam = $("#sh-cam").checked;
    const disp = await navigator.mediaDevices.getDisplayMedia({
      video: { preferCurrentTab: true }, audio: true, selfBrowserSurface: "include",
    });
    streams.push(disp);
    let tracks = [...disp.getVideoTracks()];

    if (wantMic) {
      const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
      streams.push(mic);
      if (disp.getAudioTracks().length) {        // mix tab audio + mic into one track
        ctx = new AudioContext();
        const out = ctx.createMediaStreamDestination();
        ctx.createMediaStreamSource(disp).connect(out);
        ctx.createMediaStreamSource(mic).connect(out);
        tracks.push(...out.stream.getAudioTracks());
      } else tracks.push(...mic.getAudioTracks());
    } else tracks.push(...disp.getAudioTracks());

    if (wantCam) {
      const cam = await navigator.mediaDevices.getUserMedia({ video: { width: 640 } });
      streams.push(cam);
      const pip = document.createElement("video");
      pip.className = "shred-pip"; pip.muted = true; pip.autoplay = true; pip.playsInline = true;
      pip.srcObject = cam;
      ($("#stage") || $("#host")).appendChild(pip); // in-tab overlay -> composited into the capture
    }

    chunks = [];
    rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => finish(v);
    disp.getVideoTracks()[0].addEventListener("ended", () => stop()); // browser's own Stop-sharing UI
    rec.start(1000);
    capId = setTimeout(stop, CAP_MS);

    $("#lp") && !document.querySelector("#lp.on") && $("#lp").click?.(); // roll the scene if paused
    const t0 = Date.now();
    panel(v).innerHTML = `
      <h3><span class="rec">● REC</span> — shredding <time id="sh-t">0:00</time></h3>
      <div class="fine">Stop with the button here or the browser’s own “Stop sharing”.
        Hard stop at 10:00.</div>
      <div class="row"><button class="tbtn" id="sh-stop">■ Stop &amp; get the file</button></div>`;
    timerId = setInterval(() => {
      const el = $("#sh-t"); if (el) el.textContent = fmt((Date.now() - t0) / 1000);
    }, 500);
    $("#sh-stop").onclick = () => stop();
  }

  function stop() { if (rec && rec.state !== "inactive") rec.stop(); }

  function finish(v) {
    const blob = new Blob(chunks, { type: "video/webm" });
    cleanup();
    if (!blob.size) { panel(v).remove(); toast("Nothing was recorded"); return; }
    const name = `shred-${v.id}-${new Date().toISOString().slice(0, 10)}.webm`;
    const file = new File([blob], name, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    panel(v).innerHTML = `
      <h3>Your shred — ${esc(fmtBytes(blob.size))}</h3>
      <div class="fine">It exists only on this device until you send it somewhere.
        Sharing goes through your own share sheet — person to person, no platform in
        the middle. To publish it on the network, encode an MP4 companion and pair
        both files with a live replay in a v2 entry carrying
        <code>remix_of: "${esc(vkey(v))}"</code>.</div>
      <div class="row">
        ${canShare ? `<button class="tbtn" id="sh-share">Share…</button>` : ""}
        <a class="tbtn" id="sh-dl" href="${url}" download="${esc(name)}">↓ Save the file</a>
        <button class="tbtn" id="sh-bin">Discard</button>
      </div>`;
    if (canShare) $("#sh-share").onclick = () =>
      navigator.share({ files: [file], title: v.title }).catch(() => {});
    $("#sh-bin").onclick = () => { URL.revokeObjectURL(url); panel(v).remove(); toast("Discarded"); };
  }

  return { open };
})();

function fmtBytes(n) {
  return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
}

function mountLive(v, host, progressKey = v.id) {
  const scenes = (v.live.scenes || []).slice().sort((a, b) => a.t - b.t);
  const total = replayDuration(v.live);

  host.innerHTML = `
    <div class="stage" id="stage"><div class="shade" id="shade"></div></div>
    <div class="lbar">
      <span class="livetag">LIVE</span>
      <button class="tbtn" id="lp">&#9654; Play</button>
      <time id="lt">0:00</time>
      <div class="scrub" id="ls"><i style="width:0%"></i></div>
      <time id="ld">${fmt(total)}</time>
      <button class="tbtn" id="lr" title="Restart">&#8635;</button>
    </div>`;

  const stage = $("#stage", host), shade = $("#shade", host);
  let clock = 0, playing = false, raf = 0, cur = -1, frame = null, fired = new Set(), last = 0;
  let anchor = null, anchorPoll = 0;
  let destroyed = false;
  const retryTimers = new Set();

  const sceneAt = t => { let s = null; scenes.forEach((x, i) => { if (t >= x.t) { s = x; s._i = i; } }); return s; };

  /* An app is not ready when its iframe fires load - it is ready when its
     controls work. Apex spends ~3s building scenery and ships START ENGINE
     disabled until it is done, and that delay varies with the machine. Timing a
     recorded script from scene start therefore desyncs: measured here, engine
     start wandered between 0:11 and 0:14 across runs, which is the difference
     between a clean lap and a crash. So a scene may declare what "ready" means,
     and every action time is measured from the moment it comes true. Same
     script, same drive, fast laptop or slow phone. */
  function armAnchor(s) {
    clearInterval(anchorPoll); anchor = null;
    if (!s || !s.app) { anchor = clock; return; }
    const want = s.ready, t0 = performance.now();
    anchorPoll = setInterval(() => {
      if (destroyed) return;
      if (!frame) return;
      let doc; try { doc = frame.contentDocument; } catch (e) { return; }
      if (!doc || doc.readyState !== "complete") return;
      let ok = true;
      if (want) {
        let el = null;
        try { el = want.selector ? doc.querySelector(want.selector)
                  : want.text ? findText(doc, want.text) : null; } catch (e) {}
        ok = want.enabled === false ? !!el : clickable(el);
      }
      if (ok || performance.now() - t0 > 30000) { clearInterval(anchorPoll); anchor = clock; }
    }, 120);
  }

  function renderScene(s) {
    [...stage.children].forEach(c => { if (c.id !== "shade") c.remove(); });
    frame = null;
    armAnchor(s);
    if (s.card) {
      const d = document.createElement("div");
      d.className = "card3";
      d.innerHTML = `<h2>${esc(s.card.title || "")}</h2><p>${esc(s.card.sub || "")}</p>` +
                    (s.card.note ? `<small>${esc(s.card.note)}</small>` : "");
      stage.appendChild(d);
      return;
    }
    if (s.app) {
      frame = document.createElement("iframe");
      frame.src = s.app;
      frame.setAttribute("title", (s.lower && s.lower.title) || "application");
      /* allow-pointer-lock is not decoration. Without it a first-person app in
         the frame can never capture the mouse, so "pause and take the wheel"
         is a promise the player cannot keep: the viewer takes over and finds
         the camera welded in place. Chromium says so out loud —
         "Blocked pointer lock ... the 'allow-pointer-lock' permission is not
         set" — which is how this was found. */
      /* allow-forms for the same reason. The webOS scene sat on its lock
         screen for all 18 seconds because that app unlocks on a form submit,
         and Chromium refuses that too - "Blocked form submission ... because
         the form's frame is sandboxed and the 'allow-forms' permission is not
         set." Measured both ways against production: without allow-forms the
         click reaches the button and the submit event never fires; with it,
         the desktop appears. This is not a loosening - allow-scripts plus
         allow-same-origin already lets a same-origin frame escape the sandbox,
         and the browser warns as much. */
      frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock allow-forms");
      stage.appendChild(frame);
      if (s.lower) {
        const l = document.createElement("div");
        l.className = "l3";
        l.innerHTML = `<b>${esc(s.lower.title || "")} <span class="bn">${esc(s.lower.bench || "")}</span></b>` +
          (s.lower.bug ? `<div class="bg">&#9679; ${esc(s.lower.bug)}</div>` : "") +
          (s.lower.fix ? `<div class="fx">&#10003; ${esc(s.lower.fix)}</div>` : "");
        stage.appendChild(l);
      }
    }
  }

  /* A real click is a sequence of pointer/mouse events on the element that
     is actually under the cursor. Calling el.click() on a wrapper misses
     handlers bound to a child or to the document, which is exactly how the
     first version silently failed to press START ENGINE. */
  function realClick(el) {
    const doc = frame.contentDocument, win = frame.contentWindow;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const target = doc.elementFromPoint(x, y) || el;
    const opts = { bubbles: true, cancelable: true, composed: true, clientX: x, clientY: y, view: win };
    /* Watch, in the capture phase, whether a click actually lands. The old
       "belt and braces" el.click() ran unconditionally, so every control got
       activated twice: the camera button cycled Chase -> Hood, skipping
       Cockpit, and Photo mode toggled on and straight back off. A fallback must
       only fire when the real thing did not. */
    let landed = false;
    const spy = () => { landed = true; };
    doc.addEventListener("click", spy, true);
    ["pointerdown", "mousedown", "pointerup", "mouseup", "click"].forEach(type => {
      const Ctor = type.startsWith("pointer") && win.PointerEvent ? win.PointerEvent : win.MouseEvent;
      try { target.dispatchEvent(new Ctor(type, opts)); } catch (e) {}
    });
    doc.removeEventListener("click", spy, true);
    if (!landed) { try { el.click(); } catch (e) {} }
  }

  /* Visible is not the same as clickable. Apps that boot asynchronously render
     their controls disabled while assets load. Apex ships its start button as
     `<button id="startBtn" disabled>Start Engine</button>`. The first version
     found that button, saw width>0, clicked it, and returned satisfied. The
     click did nothing, because a disabled button swallows events. So readiness
     means visible AND enabled, and we keep waiting until it is. */
  function clickable(el) {
    if (!el) return false;
    const r = el.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return false;
    if (el.disabled) return false;
    if (el.getAttribute && el.getAttribute("aria-disabled") === "true") return false;
    if (el.closest && el.closest("[disabled],[aria-disabled=true]")) return false;
    try {
      const cs = frame.contentWindow.getComputedStyle(el);
      if (cs.pointerEvents === "none" || cs.visibility === "hidden" || +cs.opacity === 0) return false;
    } catch (e) {}
    return true;
  }

  /* Find a control by its visible label. Controls first, then any element:
     matching a <div> that merely *contains* the word would shadow the button. */
  function findText(doc, want) {
    const w = String(want).toLowerCase();
    const scan = sel => [...doc.querySelectorAll(sel)]
      .find(e => (e.innerText || e.value || "").trim().toLowerCase().includes(w)
                 && e.getBoundingClientRect().width > 0);
    return scan("button,a,[role=button],input,[onclick]") || scan("div,span,li") || null;
  }

  function retryClick(find, budgetMs) {
    const t0 = performance.now();
    const attempt = () => {
      if (destroyed) return;
      let el = null;
      try { el = find(); } catch (e) { el = null; }
      if (clickable(el)) { realClick(el); return; }
      if (performance.now() - t0 < budgetMs) {
        const timer = setTimeout(() => { retryTimers.delete(timer); attempt(); }, 250);
        retryTimers.add(timer);
      }
    };
    attempt();
  }

  function act(a) {
    if (destroyed || !frame) return;
    let doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    const win = frame.contentWindow;
    const hit = () => {
      if (a.selector) return doc.querySelector(a.selector);
      if (a.text) return findText(doc, a.text);

      return null;
    };
    /* A drag has to speak Pointer Events, not just Mouse Events. Modern
       canvases bind pointerdown/pointermove and never see a MouseEvent, so the
       old mouse-only drag was a silent no-op in every one of them — the vector
       editor's tools and the snow globe both looked driven and were not.
       Clicks already dispatch both; drags now do too. */
    const PID = 1;
    /* Pointer capture is the other half of that trap: an app's very first line
       is often overlay.setPointerCapture(e.pointerId), and a synthetic pointer
       id belongs to no active pointer, so it throws NotFoundError and aborts
       the whole handler before it reads a single coordinate. Swallow only that
       failure — a real pointer still captures exactly as before. */
    const shimCapture = () => {
      const P = win.Element && win.Element.prototype;
      if (!P || P.__rvCaptureShim) return;
      ["setPointerCapture", "releasePointerCapture", "hasPointerCapture"].forEach(m => {
        const orig = P[m];
        if (typeof orig !== "function") return;
        P[m] = function (id) { try { return orig.call(this, id); } catch (e) { return undefined; } };
      });
      P.__rvCaptureShim = true;
    };
    const pointer = (kind, x, y) => {
      const el = doc.elementFromPoint(x, y);
      if (!el) return;
      const down = kind !== "up";
      const base = { bubbles: true, cancelable: true, composed: true, view: win,
                     clientX: x, clientY: y, screenX: x, screenY: y,
                     button: 0, buttons: down ? 1 : 0 };
      if (win.PointerEvent) {
        try {
          el.dispatchEvent(new win.PointerEvent("pointer" + kind, {
            ...base, pointerId: PID, pointerType: "mouse", isPrimary: true,
            width: 1, height: 1, pressure: down ? 0.5 : 0
          }));
        } catch (e) {}
      }
      try { el.dispatchEvent(new win.MouseEvent("mouse" + kind, base)); } catch (e) {}
    };
    /* A KeyboardEvent carries both `code` (the physical key) and `key` (the
       character it produces). Apps disagree about which one they read - Apex
       uses keys[e.key.toLowerCase()]. A scene author should not have to know
       that, so given a `code` we derive the `key` the app expects. Sending
       code:"KeyW" with key:"KeyW" sets keys["keyw"], which nothing reads, and
       the car silently never moves. */
    const keyFromCode = code => {
      if (!code) return "";
      let m;
      if ((m = /^Key([A-Z])$/.exec(code))) return m[1].toLowerCase();
      if ((m = /^Digit(\d)$/.exec(code))) return m[1];
      if ((m = /^Numpad(\d)$/.exec(code))) return m[1];
      if (code === "Space") return " ";
      if (code === "Enter" || code === "NumpadEnter") return "Enter";
      if (/^(Arrow|Tab|Backspace|Delete|Home|End|Page|Shift|Control|Alt|Meta|Escape)/.test(code))
        return code.replace(/(Left|Right)$/, "");
      return code;
    };
    const kev = (type, code, key) => {
      const k = key || keyFromCode(code);
      return new win.KeyboardEvent(type, {
        code, key: k, bubbles: true, cancelable: true, composed: true,
        keyCode: k.length === 1 ? k.toUpperCase().charCodeAt(0) : 0
      });
    };
    try {
      switch (a.do) {
        // Apps boot asynchronously — a Three.js scene may still be "Planting
        // scenery…" when the cue fires. Retry briefly instead of silently
        // missing the click, which is exactly what happened the first time.
        case "click":   { retryClick(hit, 20000); break; }
        case "keydown": doc.dispatchEvent(kev("keydown", a.code, a.key)); break;
        case "keyup":   doc.dispatchEvent(kev("keyup", a.code, a.key)); break;
        case "key":     doc.dispatchEvent(kev("keydown", a.code, a.key));
                        doc.dispatchEvent(kev("keyup", a.code, a.key)); break;
        /* Typing has to change the value, not just announce itself. Synthetic
           key events never mutate an <input>, by design, so the old version
           dispatched a tidy keydown/keypress/keyup per character into a field
           that stayed empty - the webOS terminal sat at a bare prompt while the
           caption described the command it was supposedly running. Set the
           value as we go and fire `input`, the way a real keystroke does, then
           let Enter through so the app's own handler reads what is there. */
        case "type": {
          const txt = String(a.text || "");
          let el = null;
          try { el = a.selector ? doc.querySelector(a.selector) : null; } catch (e) {}
          if (!el) el = doc.activeElement;
          if (!el || el === doc.body) el = doc.querySelector("input:not([type=hidden]),textarea,[contenteditable=true]") || doc.body;
          try { el.focus && el.focus(); } catch (e) {}
          const editable = !!el && (/^(INPUT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable);
          for (const ch of txt) {
            if (ch === "\n" || ch === "\r") {
              el.dispatchEvent(kev("keydown", "Enter", "Enter"));
              el.dispatchEvent(kev("keyup", "Enter", "Enter"));
              continue;
            }
            const code = /[a-z]/i.test(ch) ? "Key" + ch.toUpperCase() : /\d/.test(ch) ? "Digit" + ch : ch === " " ? "Space" : "";
            el.dispatchEvent(kev("keydown", code, ch));
            if (editable) {
              if (el.isContentEditable) el.textContent += ch; else el.value += ch;
              try { el.dispatchEvent(new win.InputEvent("input", { bubbles: true, data: ch, inputType: "insertText" })); }
              catch (e) { el.dispatchEvent(new win.Event("input", { bubbles: true })); }
            }
            el.dispatchEvent(kev("keyup", code, ch));
          }
          break;
        }
        case "drag":    { const f = a.from || [0, 0], to = a.to || [0, 0], N = 12;
                          shimCapture();
                          pointer("down", f[0], f[1]);
                          /* A gesture with no intermediate motion is not a
                             drag — apps latch a `moved` flag on the first
                             pointermove and treat anything else as a click. */
                          for (let i = 1; i <= N; i++)
                            pointer("move", f[0] + (to[0] - f[0]) * i / N, f[1] + (to[1] - f[1]) * i / N);
                          pointer("up", to[0], to[1]); break; }
        /* Real tools are taller than a 16:10 stage. Without this, the most
           interesting half of an app — the 808's step sequencer, a long
           settings page — is simply below the fold for the whole scene, and
           the only fix available to a scene author was to not use the app. */
        case "scroll":  { const el = (a.selector || a.text) ? hit() : null;
                          if (el && el.scrollIntoView) el.scrollIntoView({ block: a.block || "center", inline: "nearest", behavior: a.behavior || "smooth" });
                          else if (a.to) win.scrollTo({ left: a.to[0] || 0, top: a.to[1] || 0, behavior: a.behavior || "smooth" });
                          break; }
      }
    } catch (e) { /* app not ready or blocked — never break playback */ }
  }

  function paint() {
    $("#lt", host).textContent = fmt(clock);
    $("#ls i", host).style.width = (clock / total * 100).toFixed(2) + "%";
    const s = sceneAt(clock);
    if (s) shade.style.opacity = clock > s.t + (s.dur || 0) - 0.5 ? 0.55 : 0;
    const chapters = v.live.chapters || [];
    const btns = app.querySelectorAll(".chapters button");
    if (chapters.length && btns.length) {
      let active = 0;
      chapters.forEach((chapter, i) => { if (clock >= chapter.t - 0.25) active = i; });
      btns.forEach((button, i) => button.classList.toggle("on", i === active));
    }
  }

  function seek(t) {
    if (destroyed) return;
    clock = Math.max(0, Math.min(total, t));
    const s = sceneAt(clock);
    if (s && s._i !== cur) { cur = s._i; fired.clear(); renderScene(s); }
    if (s) (s.actions || []).forEach((a, i) => {
      const key = cur + ":" + i;
      const due = anchor === null ? Infinity : anchor + a.at;
      if (clock >= due && !fired.has(key)) { fired.add(key); act(a); }
    });
    paint();
    state.history[progressKey] = { t: clock, d: total, at: Date.now() };
    save();
  }

  function tick(now) {
    if (!playing) return;
    if (last) seek(clock + (now - last) / 1000);
    last = now;
    if (clock >= total) { pause(); return; }
    raf = requestAnimationFrame(tick);
  }
  function play()  { if (playing) return; playing = true; last = 0; $("#lp", host).innerHTML = "&#10074;&#10074; Pause"; raf = requestAnimationFrame(tick); }
  function pause() { playing = false; cancelAnimationFrame(raf); $("#lp", host).innerHTML = "&#9654; Play"; }

  $("#lp", host).onclick = () => playing ? pause() : play();
  $("#lr", host).onclick = () => { cur = -1; seek(0); };
  $("#ls", host).onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    cur = -1; seek((e.clientX - r.left) / r.width * total);
  };

  const h = state.history[progressKey];
  seek(h && h.t > 2 && h.t < total - 4 ? h.t : 0);

  const keys = e => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "k") { e.preventDefault(); playing ? pause() : play(); }
    else if (k === "arrowright" || k === "l") { cur = -1; seek(clock + 10); }
    else if (k === "arrowleft"  || k === "j") { cur = -1; seek(clock - 10); }
  };
  return {
    keys,
    seek,
    play,
    destroy() {
      if (destroyed) return;
      destroyed = true;
      pause();
      clearInterval(anchorPoll);
      retryTimers.forEach(clearTimeout);
      retryTimers.clear();
      if (frame) {
        try { frame.src = "about:blank"; } catch {}
        frame.remove();
      }
      host.innerHTML = "";
    }
  };
}

function bindCommon(id) {
  $("#b-like").onclick = e => {
    const i = state.liked.indexOf(id);
    if (i < 0) { state.liked.push(id); e.target.classList.add("on"); e.target.textContent = "♥ Liked"; }
    else { state.liked.splice(i, 1); e.target.classList.remove("on"); e.target.textContent = "♥ Like"; }
    save(); toast(i < 0 ? "Liked" : "Removed like");
  };
  $("#b-later").onclick = e => {
    const i = state.later.indexOf(id);

function mountEncoded(v, host, progressKey) {
  const portrait = v.orientation === "portrait";
  host.innerHTML = `<div class="player${portrait ? " portrait" : ""}">
    <video id="v" controls playsinline preload="metadata"
           poster="${esc(v.thumb)}" class="${portrait ? "portrait" : ""}">
      ${(v.sources || []).map(s => `<source src="${esc(s.src)}" type='${esc(s.type)}'>`).join("")}
      Your browser can’t play this video.
      <a href="${esc(v.sources[0].src)}">Download it instead.</a>
    </video>
  </div>`;
  const vid = $("#v", host);
  vid.playbackRate = state.rate;

  const h = state.history[progressKey];
  const resume = () => {
    if (h && h.t > 3 && h.d && h.t < h.d - 8) {
      vid.currentTime = h.t;
      toast(`Resuming guided video at ${fmt(h.t)}`);
    }
  };
  vid.addEventListener("loadedmetadata", resume, { once: true });

  let last = 0;
  const update = () => {
    const now = Date.now();
    if (now - last < 1000) return;
    last = now;
    if (vid.duration) {
      state.history[progressKey] = { t: vid.currentTime, d: vid.duration, at: now };
      save();
    }
    const btns = app.querySelectorAll(".chapters button");
    if (btns.length) {
      let active = 0;
      (v.chapters || []).forEach((c, i) => { if (vid.currentTime >= c.t - 0.25) active = i; });
      btns.forEach((b, i) => b.classList.toggle("on", i === active));
    }
  };
  vid.addEventListener("timeupdate", update);
  app.querySelectorAll(".chapters button").forEach(b => b.onclick = () => {
    vid.currentTime = +b.dataset.t;
    vid.play().catch(() => {});
  });
  const speed = $("#b-speed");
  if (speed) speed.onclick = e => {
    const steps = [0.75, 1, 1.25, 1.5, 1.75, 2];
    state.rate = steps[(steps.indexOf(state.rate) + 1) % steps.length];
    vid.playbackRate = state.rate;
    e.target.textContent = `Speed ${state.rate}×`;
    save();
  };

  const keys = e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === " " || k === "k") { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); }
    else if (k === "arrowright" || k === "l") vid.currentTime += 10;
    else if (k === "arrowleft" || k === "j") vid.currentTime -= 10;
    else if (k === "m") vid.muted = !vid.muted;
    else if (k === "f") (document.fullscreenElement ? document.exitFullscreen() : vid.requestFullscreen?.());
    else if (k >= "0" && k <= "9" && vid.duration) vid.currentTime = vid.duration * (+k / 10);
  };
  document.addEventListener("keydown", keys);
  return {
    destroy() {
      document.removeEventListener("keydown", keys);
      vid.removeEventListener("timeupdate", update);
      vid.removeEventListener("loadedmetadata", resume);
      try { vid.pause(); } catch {}
      vid.removeAttribute("src");
      [...vid.querySelectorAll("source")].forEach(source => source.removeAttribute("src"));
      try { vid.load(); } catch {}
      host.innerHTML = "";
    }
  };
}
