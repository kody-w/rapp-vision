# The content machine's clock. Two jobs a day, both non-fatal, both dry-run:
#
#   propose — walk the network for gaps (stale channels, thin coverage, viewer
#             signals saying "confused" or "want more") and refresh the proposal
#             queue in state/proposals.json. It NEVER publishes into a channel:
#             a proposal is promoted by a person, or not at all. The queue is
#             the steering wheel, not an autopilot.
#   review  — score published videos against the versioned rubric and write the
#             verdicts through the EDITORIAL lane only. Machine judgment never
#             touches a human counter (the founding tenet of rapp-metrics/1.0:
#             the actor determines the lane, never the subject).
#
# The default adapter is 'dryrun' and --allow-model is deliberately absent:
# this workflow can propose and score from local evidence, but it cannot spend
# model credits or generate prose unattended. Wiring a real adapter is a
# human edit to this file, on purpose.
#
# Cron sits at 09:40 UTC: after RAR's 05:20 metrics and 07:00 ratings crons and
# after this repo's own 08:10 metrics refresh, so the machine reads today's
# numbers, not yesterday's.
name: Content Machine

on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automation-content-machine
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/content-machine
  ALLOWED_STATE_FILES: "state/proposals.json state/editorial_reviews.json"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  propose-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resume automation branch on current main
        run: |
          set -euo pipefail

          reject_unallowed_paths() {
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                state/proposals.json|state/editorial_reviews.json) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          }

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          remote_sha="$(git ls-remote --heads origin \
            "refs/heads/$AUTOMATION_BRANCH" | awk '{print $1}')"
          echo "AUTOMATION_REMOTE_SHA=$remote_sha" >> "$GITHUB_ENV"

          if [ -n "$remote_sha" ]; then
            remote_ref="refs/remotes/origin/$AUTOMATION_BRANCH"
            git fetch --no-tags origin \
              "+refs/heads/$AUTOMATION_BRANCH:$remote_ref"

            unexpected_paths="$(
              git diff --name-only --no-renames origin/main..."$remote_ref" |
                reject_unallowed_paths
            )"
            if [ -n "$unexpected_paths" ]; then
              echo "Refusing to resume $AUTOMATION_BRANCH: its diff from origin/main contains unexpected paths:" >&2
              printf '%s\n' "$unexpected_paths" >&2
              exit 1
            fi

            # Never replay automation-branch history. Rebuild from trusted
            # current main and carry forward only the two verified snapshots.
            git checkout -B "$AUTOMATION_BRANCH" origin/main
            for path in $ALLOWED_STATE_FILES; do
              if git cat-file -e "$remote_ref:$path" 2>/dev/null; then
                mkdir -p "$(dirname "$path")"
                git show "$remote_ref:$path" > "$path"
              else
                rm -f -- "$path"
              fi
            done
          else
            git checkout -B "$AUTOMATION_BRANCH" origin/main
          fi

          unexpected_paths="$(
            {
              git diff --name-only --no-renames
              git ls-files --others --exclude-standard
            } | sort -u | reject_unallowed_paths
          )"
          if [ -n "$unexpected_paths" ]; then
            echo "Refusing to execute content machinery after restoring unexpected paths:" >&2
            printf '%s\n' "$unexpected_paths" >&2
            exit 1
          fi

      # Same mirror step as metrics.yml, for the same reason: channel
      # enumeration is filesystem-only by design, and the cross-repo channels
      # live at ../<repo>/... relative to this checkout.
      - name: Mirror sibling channel files
        run: |
          for p in localFirstTools/rappvision localFirstTools/rappvision/rooms \
                   localFirstTools/rappvision/arcade localFirstTools/rappvision/workbench \
                   learnwithkody/rappvision catchup/rappvision \
                   rappvision-field-notes/rappvision; do
            mkdir -p "../$p"
            curl -sf --max-time 20 "https://kody-w.github.io/$p/channel.json" \
              -o "../$p/channel.json" || echo "skip $p (unreachable today)"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Self-test first: a machine that cannot pass its own offline suite has
      # no business writing proposals. Cheap (no network), and a red here
      # stops the run before any state file is touched.
      - name: Self-test
        run: python3 scripts/content_machine.py selftest

      # Non-fatal by design (no --strict): a bad network day leaves the
      # proposal queue exactly as it was rather than emptying it. The queue is
      # durable state a human may have triaged; silence must never erase it.
      - name: Refresh proposal queue
        run: python3 scripts/content_machine.py propose --metrics state/metrics.json

      # Editorial lane only. --review-limit caps the day's writes so a big
      # catalog drains over successive runs instead of hammering the API.
      - name: Review published videos (editorial lane)
        run: python3 scripts/content_machine.py review --review-limit 20

      - name: Commit state if changed
        run: |
          set -euo pipefail

          reject_unallowed_paths() {
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                state/proposals.json|state/editorial_reviews.json) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          }

          changed_paths="$(
            {
              git diff --name-only --no-renames origin/main...HEAD
              git diff --name-only --no-renames
              git diff --cached --name-only --no-renames
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          unexpected_paths="$(printf '%s\n' "$changed_paths" | reject_unallowed_paths)"
          if [ -n "$unexpected_paths" ]; then
            echo "Unexpected changed paths; refusing to commit:" >&2
            printf '%s\n' "$unexpected_paths" >&2
            exit 1
          fi

          staged=false
          for path in $ALLOWED_STATE_FILES; do
            if [ -n "$(git status --porcelain -- "$path")" ]; then
              git add -- "$path"
              staged=true
            fi
          done
          if [ "$staged" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(machine): refresh proposals + editorial reviews"
          else
            echo "No new state changes to commit; preserving any resumed branch state."
          fi

          unexpected_paths="$(
            git diff --name-only --no-renames origin/main...HEAD |
              reject_unallowed_paths
          )"
          if [ -n "$unexpected_paths" ]; then
            echo "Refusing to push a branch whose diff from origin/main contains unexpected paths:" >&2
            printf '%s\n' "$unexpected_paths" >&2
            exit 1
          fi
          if git diff --quiet origin/main...HEAD; then
            echo "No automation state differs from main; nothing to push."
            exit 0
          fi

          gh auth setup-git
          if [ -n "$AUTOMATION_REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:$AUTOMATION_REMOTE_SHA" \
              origin "HEAD:$AUTOMATION_BRANCH"
          else
            git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:" \
              origin "HEAD:$AUTOMATION_BRANCH"
          fi

          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" \
            --state open --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            echo "$PR_URL"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AUTOMATION_BRANCH" \
              --title "chore(machine): refresh proposals and editorial reviews" \
              --body "Automated content-machine state refresh. This PR is intentionally review-ready; GITHUB_TOKEN does not bypass protected-main checks."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
