name: Publication Policy

on:
  push:
    branches: [main, "policy/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate paired template
        run: python3 scripts/validate_publications.py template/channel.json

      - name: Validate default registry
        run: python3 scripts/validate_publications.py --registry channels.json

      - name: Full offline test suite
        run: python3 -m unittest discover -s tests -v
        env:
          RAPP_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          RAPP_FFMPEG: /usr/bin/ffmpeg
          RAPP_FFPROBE: /usr/bin/ffprobe
