name: Harvest follow index

# Static Data Covenant (kody-w/RAR CONSTITUTION.md Article XXIV): the
# player's visitor browser must never call api.github.com. This workflow is
# the CI harvester for the "follow a GitHub owner" convention — it reads
# state/follow-seed.json, calls the repos-listing endpoint for each seeded
# owner, and commits the matching rappvision-* entries to
# state/follow-index.json. index.html's ownerEntries() only ever reads that
# committed file (see scripts/harvest_follows.py for the full contract and
# its documented limitation).

on:
  schedule:
    - cron: "40 8 * * *"  # daily, staggered from this repo's other crons
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "state/follow-seed.json"
      - "scripts/harvest_follows.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automation-harvest-follows
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/harvest-follows

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset automation branch from current main
        run: |
          git fetch origin main
          echo "AUTOMATION_REMOTE_SHA=$(git ls-remote --heads origin "$AUTOMATION_BRANCH" | awk '{print $1}')" >> "$GITHUB_ENV"
          git checkout -B "$AUTOMATION_BRANCH" origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest follow index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/harvest_follows.py

      - name: Commit snapshot if changed
        run: |
          if [ -z "$(git status --porcelain state/follow-index.json)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/follow-index.json
          git commit -m "chore(follows): refresh follow index snapshot"

          if [ -n "$AUTOMATION_REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:$AUTOMATION_REMOTE_SHA" \
              origin "HEAD:$AUTOMATION_BRANCH"
          else
            git push origin "HEAD:$AUTOMATION_BRANCH"
          fi

          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" \
            --state open --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            echo "$PR_URL"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AUTOMATION_BRANCH" \
              --title "chore(follows): refresh follow index snapshot" \
              --body "Automated follow-index refresh. Review and merge through the protected main branch; no automation bypass is requested."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
